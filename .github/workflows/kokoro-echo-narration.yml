name: FrameForge - Kokoro Echo narration

on:
  push:
    branches: [main]
    paths:
      - "audio_requests/wombat_cubes_narration.txt"
      - "tools/kokoro_frameforge_tts.py"
      - ".github/workflows/kokoro-echo-narration.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frameforge-kokoro-echo-wombat
  cancel-in-progress: false

jobs:
  synthesize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out FrameForge
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system audio tools
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng ffmpeg

      - name: Install Kokoro and audio dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "kokoro==0.9.4" soundfile numpy

      - name: Generate timestamped Echo narration
        run: |
          python tools/kokoro_frameforge_tts.py \
            --input audio_requests/wombat_cubes_narration.txt \
            --out-dir build/wombat-cubes-echo \
            --duration 30

      - name: Upload FrameForge narration files
        uses: actions/upload-artifact@v4
        with:
          name: wombat-cubes-kokoro-echo-audio
          path: build/wombat-cubes-echo/
          if-no-files-found: error
          retention-days: 14
