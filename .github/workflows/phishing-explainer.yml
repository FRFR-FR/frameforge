name: CyberSpace Unlocked — Phishing Awareness 2-Minute Film
run-name: Build CyberSpace Unlocked phishing-awareness film

on:
  push:
    branches: [main]
    paths:
      - 'blender_pipeline/phishing_explainer.py.gz'
      - 'blender_pipeline/make_phishing_characters.py.gz'
      - 'blender_pipeline/phishing_narration.txt'
      - 'blender_pipeline/assets/**'
      - '.github/workflows/phishing-explainer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Build 2D characters and audit the complete 3D world
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender, Pillow and render dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes blender python3-pil ffmpeg xvfb libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri libx11-6 libxext6 libxrender1 libxi6 libxxf86vm1 libsm6 libxkbcommon0 libdbus-1-3 libfontconfig1 libfreetype6 fonts-dejavu-core
          blender --version
          gunzip -kf blender_pipeline/make_phishing_characters.py.gz blender_pipeline/phishing_explainer.py.gz
          python3 - <<'PY'
          from pathlib import Path
          p = Path("blender_pipeline/phishing_explainer.py")
          s = p.read_text()
          old = 'world.color=PAL["void"]'
          if old not in s:
              raise SystemExit("Expected Blender world RGB assignment was not found")
          s = s.replace(old, 'world.color=PAL["void"][:3]')
          old_nodes = '''    # Subtle glow pass for emissive neon elements.
              scene.use_nodes=True
              nt=scene.node_tree; nt.nodes.clear()
              rl=nt.nodes.new("CompositorNodeRLayers")
              glare=nt.nodes.new("CompositorNodeGlare"); glare.glare_type="FOG_GLOW"
              safe_set(glare,"threshold",1.5); safe_set(glare,"quality","MEDIUM")
              comp=nt.nodes.new("CompositorNodeComposite")
              nt.links.new(rl.outputs["Image"],glare.inputs["Image"])
              nt.links.new(glare.outputs["Image"],comp.inputs["Image"])
          '''
          new_nodes = '''    # Blender 5.x has no legacy Scene.node_tree property here.
              # Neon remains visible from emissive materials and scene lighting.
          '''
          if old_nodes not in s:
              raise SystemExit("Expected legacy compositor block was not found")
          p.write_text(s.replace(old_nodes, new_nodes))
          PY
          python3 -m py_compile blender_pipeline/make_phishing_characters.py blender_pipeline/phishing_explainer.py
      - name: Create expressive character sprite pack
        run: python3 blender_pipeline/make_phishing_characters.py
      - name: Build scene and audit all 3,600 frames
        run: |
          set -euo pipefail
          mkdir -p output/phishing_explainer
          blender --background --python-exit-code 1 \
            --python blender_pipeline/phishing_explainer.py -- \
            --mode audit --output-dir output/phishing_explainer
          python3 - <<'PY'
          import json
          p='output/phishing_explainer/audit.json'
          d=json.load(open(p,encoding='utf-8'))
          assert d['status']=='PASS',d
          assert d['duration_seconds']==120,d
          assert d['frame_count']==3600,d
          assert d['resolution']==[720,1280],d
          assert d['character_sprite_planes']>=40,d
          assert d['midpoint_cta']=='Like and subscribe',d
          assert d['ending_cta']=='Buy CyberSpace Unlocked',d
          print('PHISHING_SCENE_AUDIT_PASS',d['frame_count'],'frames',d['character_sprite_planes'],'character states')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: CyberSpace-Phishing-Scene-Audit
          path: |
            output/phishing_explainer/*.blend
            output/phishing_explainer/audit.json
          if-no-files-found: error
          retention-days: 14

  render:
    name: Render cinematic section ${{ matrix.segment }}
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        segment: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender and FFmpeg render dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes blender python3-pil ffmpeg xvfb libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri libx11-6 libxext6 libxrender1 libxi6 libxxf86vm1 libsm6 libxkbcommon0 libdbus-1-3 libfontconfig1 libfreetype6 fonts-dejavu-core
          blender --version
          gunzip -kf blender_pipeline/make_phishing_characters.py.gz blender_pipeline/phishing_explainer.py.gz
          python3 - <<'PY'
          from pathlib import Path
          p = Path("blender_pipeline/phishing_explainer.py")
          s = p.read_text()
          old = 'world.color=PAL["void"]'
          if old not in s:
              raise SystemExit("Expected Blender world RGB assignment was not found")
          s = s.replace(old, 'world.color=PAL["void"][:3]')
          old_nodes = '''    # Subtle glow pass for emissive neon elements.
              scene.use_nodes=True
              nt=scene.node_tree; nt.nodes.clear()
              rl=nt.nodes.new("CompositorNodeRLayers")
              glare=nt.nodes.new("CompositorNodeGlare"); glare.glare_type="FOG_GLOW"
              safe_set(glare,"threshold",1.5); safe_set(glare,"quality","MEDIUM")
              comp=nt.nodes.new("CompositorNodeComposite")
              nt.links.new(rl.outputs["Image"],glare.inputs["Image"])
              nt.links.new(glare.outputs["Image"],comp.inputs["Image"])
          '''
          new_nodes = '''    # Blender 5.x has no legacy Scene.node_tree property here.
              # Neon remains visible from emissive materials and scene lighting.
          '''
          if old_nodes not in s:
              raise SystemExit("Expected legacy compositor block was not found")
          p.write_text(s.replace(old_nodes, new_nodes))
          PY
          python3 -m py_compile blender_pipeline/make_phishing_characters.py blender_pipeline/phishing_explainer.py
      - name: Rebuild the character assets on this render worker
        run: python3 blender_pipeline/make_phishing_characters.py
      - name: Render 15-second segment at 720p vertical, 30 FPS
        run: |
          set -euo pipefail
          mkdir -p output/phishing_explainer
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 blender --background --python-exit-code 1 \
            --python blender_pipeline/phishing_explainer.py -- \
            --mode render --segment-index ${{ matrix.segment }} --output-dir output/phishing_explainer
      - uses: actions/upload-artifact@v4
        with:
          name: CyberSpace-Phishing-Part-${{ matrix.segment }}
          path: output/phishing_explainer/segment_${{ matrix.segment }}.mp4
          if-no-files-found: error
          retention-days: 14

  assemble:
    name: Assemble, narrate and verify final two-minute MP4
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: CyberSpace-Phishing-Part-*
          path: output/segments
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: CyberSpace-Phishing-Scene-Audit
          path: output/project
      - name: Install audio and video tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg espeak-ng python3
          ffmpeg -version | head -n 1
      - name: Join segments, add narration and verify final export
        run: |
          set -euo pipefail
          mkdir -p output/final
          for i in 00 01 02 03 04 05 06 07; do test -s "output/segments/segment_${i}.mp4"; done
          for i in 00 01 02 03 04 05 06 07; do printf "file '%s'\\n" "$PWD/output/segments/segment_${i}.mp4"; done > output/concat.txt
          ffmpeg -y -f concat -safe 0 -i output/concat.txt -c copy output/silent_join.mp4
          espeak-ng -v en-us -s 137 -p 43 -a 170 -f blender_pipeline/phishing_narration.txt -w output/narration.wav
          ffmpeg -y -i output/silent_join.mp4 -i output/narration.wav \
            -filter_complex "[1:a]apad=pad_dur=120,volume=1.0[a]" \
            -map 0:v:0 -map "[a]" -t 120 -c:v copy -c:a aac -b:a 192k \
            -movflags +faststart output/final/CyberSpace_Unlocked_Phishing_Awareness_120s.mp4
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height,r_frame_rate -of json \
            output/final/CyberSpace_Unlocked_Phishing_Awareness_120s.mp4 > output/final/verification.json
          python3 - <<'PY'
          import json
          d=json.load(open('output/final/verification.json'))
          v=next(s for s in d['streams'] if s['codec_name']=='h264')
          a=next(s for s in d['streams'] if s['codec_name']=='aac')
          dur=float(d['format']['duration'])
          size=int(d['format']['size'])
          assert (v['width'],v['height'])==(720,1280),v
          assert v['r_frame_rate']=='30/1',v
          assert 119.7 <= dur <= 120.3,dur
          assert size>1500000,size
          print('FINAL_VIDEO_VERIFIED',dur,'seconds',v['width'],'x',v['height'],v['r_frame_rate'],'audio',a['codec_name'],'bytes',size)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: CyberSpace-Unlocked-Phishing-Awareness-FINAL
          path: |
            output/final/CyberSpace_Unlocked_Phishing_Awareness_120s.mp4
            output/final/verification.json
            output/project/*.blend
            output/project/audit.json
            output/narration.wav
          if-no-files-found: error
          retention-days: 14
