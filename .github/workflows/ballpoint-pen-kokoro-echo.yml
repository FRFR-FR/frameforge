name: FrameForge — Ballpoint Pen Kokoro Echo Narration
run-name: Render ballpoint-pen narration with Kokoro Echo

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ballpoint-pen-kokoro-echo.yml"
      - "projects/ballpoint-pen-narrative/generate_echo.py"
      - "projects/ballpoint-pen-narrative/narration.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frameforge-ballpoint-pen-kokoro-echo
  cancel-in-progress: false

jobs:
  synthesize:
    name: Synthesize and verify Echo MP3
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - name: Check out FrameForge
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache Kokoro model weights
        uses: actions/cache@v4
        with:
          path: .cache/huggingface
          key: frameforge-kokoro-82m-am-echo-v1

      - name: Install FFmpeg and eSpeak NG
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg espeak-ng
          ffmpeg -version | head -n 1
          espeak-ng --version | head -n 1

      - name: Install CPU-only PyTorch and Kokoro
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0+cpu torchaudio==2.6.0+cpu
          python -m pip install "kokoro==0.9.4" "numpy==1.26.4" soundfile
          python - <<'PY'
          import torch, kokoro, soundfile
          print("torch", torch.__version__)
          print("kokoro module loaded")
          print("soundfile", soundfile.__version__)
          PY

      - name: Generate narration with Kokoro Echo
        run: |
          python projects/ballpoint-pen-narrative/generate_echo.py

      - name: Verify MP3, exact PCM duration, voice and CTA timing
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d = Path("projects/ballpoint-pen-narrative/output")
          meta = json.loads((d / "timing.json").read_text())
          mp3 = d / "ballpoint-pen-narration-echo.mp3"
          wav = d / "ballpoint-pen-narration-echo.wav"
          assert meta["status"] == "PASS", meta
          assert meta["voice"] == "Kokoro Echo (am_echo)", meta
          assert abs(meta["wav_duration_seconds"] - 30.0) < 1e-6, meta
          assert meta["cta_start_seconds"] == 10.0, meta
          assert mp3.is_file() and mp3.stat().st_size > 50_000
          assert wav.is_file() and wav.stat().st_size > 100_000
          print("KOKORO_ECHO_RENDER_VERIFIED")
          print(json.dumps(meta, indent=2))
          print("MP3 bytes:", mp3.stat().st_size)
          PY

      - name: Upload MP3, WAV master and timing report
        uses: actions/upload-artifact@v4
        with:
          name: FrameForge-Ballpoint-Pen-Kokoro-Echo
          path: |
            projects/ballpoint-pen-narrative/output/ballpoint-pen-narration-echo.mp3
            projects/ballpoint-pen-narrative/output/ballpoint-pen-narration-echo.wav
            projects/ballpoint-pen-narrative/output/timing.json
          if-no-files-found: error
          retention-days: 30

      - name: Save generated narration into FrameForge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/ballpoint-pen-narrative/output/ballpoint-pen-narration-echo.mp3
          git add projects/ballpoint-pen-narrative/output/timing.json
          if git diff --cached --quiet; then
            echo "No generated narration changes to commit."
          else
            git commit -m "Add generated Kokoro Echo ballpoint-pen narration"
            git push origin HEAD:main
          fi
