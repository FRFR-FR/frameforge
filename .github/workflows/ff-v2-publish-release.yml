name: FrameForge V2 Publish Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Annotated release tag (for example v2.0.0)
        required: true
        default: v2.0.0
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: frameforge-v2-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out full repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag and current branch
        env:
          RELEASE_TAG: ${{ inputs.tag_name }}
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must match vMAJOR.MINOR.PATCH (for example v2.0.0)."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release tag already exists: $RELEASE_TAG"
            exit 1
          fi
          echo "Release tag: $RELEASE_TAG"
          echo "Release commit: $GITHUB_SHA"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned development dependencies and FFmpeg
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Verify required CI results for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          repo=os.environ["REPOSITORY"]
          sha=os.environ["RELEASE_SHA"]
          token=os.environ["GH_TOKEN"]
          request=urllib.request.Request(
              f"https://api.github.com/repos/{repo}/actions/runs?branch=main&per_page=100",
              headers={"Authorization":f"Bearer {token}","Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              runs=json.load(response).get("workflow_runs",[])
          required={
              "FrameForge V2 Foundation Validation": sha,
              "FrameForge V2 Pilot Builds and QA": sha,
              "FrameForge V2 Browser Smoke": None
          }
          errors=[]
          for name, expected_sha in required.items():
              matches=[r for r in runs if r.get("name")==name and r.get("head_branch")=="main" and (expected_sha is None or r.get("head_sha")==expected_sha)]
              if not matches:
                  errors.append(f"{name}: no successful matching run found")
                  continue
              latest=max(matches,key=lambda r:r.get("created_at",""))
              if latest.get("status")!="completed" or latest.get("conclusion")!="success":
                  errors.append(f"{name}: latest matching run is {latest.get('status')}/{latest.get('conclusion')}")
              else:
                  print(f"PASS {name}: {latest.get('html_url')}")
          if errors:
              raise SystemExit("Release blocked: "+"; ".join(errors))
          PY

      - name: Re-run Python and JavaScript core suites
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v
          node --test tests/ff-v2-core.test.js tests/ff-v2-renderer.test.js tests/ff-v2-audio.test.js tests/ff-v2-director.test.js tests/ff-v2-production.test.js
          node --check ff-v2-mobile.js
          node --check ff-v2-render-queue.js

      - name: Validate the two end-to-end pilot projects
        run: |
          for project_dir in projects/v2-pilots/entertainment-power-scale projects/v2-pilots/cybersecurity-phishing-check; do
            python tools/validate_project.py "$project_dir/project.json"
            python tools/validate_media_manifest.py "$project_dir/media_manifest.json"
          done

      - name: Create annotated tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" "$GITHUB_SHA" -m "FrameForge $RELEASE_TAG"
          git push origin "$RELEASE_TAG"
          gh release create "$RELEASE_TAG" \
            --title "FrameForge $RELEASE_TAG" \
            --notes-file docs/FF_V2_RELEASE_NOTES.md \
            --verify-tag
