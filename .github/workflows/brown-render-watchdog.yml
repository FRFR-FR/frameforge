name: BROWN Render 2-Hour Watchdog

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/brown-render-watchdog.yml"

permissions:
  actions: write
  contents: read

concurrency:
  group: brown-book-one-watchdog
  cancel-in-progress: false

jobs:
  inspect-and-recover:
    name: Inspect every part and recover missing renders
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Inspect all recent render batches and relaunch missing parts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          RUNS="$(gh api "repos/${GH_REPO}/actions/workflows/brown-render-controller.yml/runs?branch=main&per_page=100")"
          if [ "$(jq '.workflow_runs | length' <<< "${RUNS}")" -eq 0 ]; then
            echo "No render batches exist yet; all 24 parts need a first render."
          fi

          declare -A DONE ACTIVE
          FINAL_FOUND=0

          while IFS= read -r run_id; do
            JOBS="$(gh api "repos/${GH_REPO}/actions/runs/${run_id}/jobs?per_page=100")"
            ARTIFACTS="$(gh api "repos/${GH_REPO}/actions/runs/${run_id}/artifacts?per_page=100")"

            if [ "$(jq '[.artifacts[] | select(.name == "BROWN-Book-One-Complete-2h-720p20" and .expired == false)] | length' <<< "${ARTIFACTS}")" -gt 0 ]; then
              FINAL_FOUND=1
            fi

            for n in $(seq -w 1 24); do
              name="brown-part-${n}"
              if [ "$(jq --arg name "${name}" '[.artifacts[] | select(.name == $name and .expired == false)] | length' <<< "${ARTIFACTS}")" -gt 0 ]; then
                DONE["${n}"]=1
                continue
              fi

              job="$(jq -c --arg name "Render part ${n}" '[.jobs[] | select(.name == $name)] | last // empty' <<< "${JOBS}")"
              [ -n "${job}" ] || continue
              status="$(jq -r '.status // empty' <<< "${job}")"
              started="$(jq -r '.started_at // empty' <<< "${job}")"
              if [[ "${status}" == "queued" || "${status}" == "in_progress" || "${status}" == "waiting" || "${status}" == "pending" ]]; then
                age=0
                if [ -n "${started}" ]; then
                  started_epoch="$(date -u -d "${started}" +%s)"
                  age="$(( $(date -u +%s) - started_epoch ))"
                fi
                if [ "${age}" -lt 19800 ]; then
                  ACTIVE["${n}"]=1
                else
                  echo "STALE_JOB part=${n} age_seconds=${age}; will schedule a recovery copy."
                fi
              fi
            done
          done < <(jq -r '.workflow_runs[].id' <<< "${RUNS}")

          missing_json='['
          separator=''
          done_count=0
          active_count=0
          missing_count=0
          for n in $(seq -w 1 24); do
            if [ "${DONE[${n}]+yes}" = "yes" ]; then
              done_count=$((done_count + 1))
            elif [ "${ACTIVE[${n}]+yes}" = "yes" ]; then
              active_count=$((active_count + 1))
            else
              missing_json="${missing_json}${separator}\"${n}\""
              separator=','
              missing_count=$((missing_count + 1))
            fi
          done
          missing_json="${missing_json}]"

          echo "PART_STATUS completed_artifacts=${done_count}/24 active_jobs=${active_count} missing_parts=${missing_count}"

          if [ "${missing_count}" -gt 0 ]; then
            payload="$(jq -cn --arg parts "${missing_json}" --arg batch "watchdog-${GH_RUN_ID}" '{ref:"main",inputs:{parts:$parts,batch_id:$batch}}')"
            echo "Dispatching recovery render for missing parts: ${missing_json}"
            gh api --method POST "repos/${GH_REPO}/actions/workflows/brown-render-controller.yml/dispatches" --input - <<< "${payload}"
            echo "RECOVERY_DISPATCHED parts=${missing_json}"
            exit 0
          fi

          if [ "${active_count}" -gt 0 ]; then
            echo "All unrendered parts still have active jobs; no duplicate render was started."
            exit 0
          fi

          if [ "${done_count}" -eq 24 ] && [ "${FINAL_FOUND}" -eq 0 ]; then
            payload="$(jq -cn --arg batch "watchdog-assembly-${GH_RUN_ID}" '{ref:"main",inputs:{parts:"[]",batch_id:$batch}}')"
            echo "All 24 parts are available; dispatching assembly-only recovery."
            gh api --method POST "repos/${GH_REPO}/actions/workflows/brown-render-controller.yml/dispatches" --input - <<< "${payload}"
            echo "ASSEMBLY_DISPATCHED"
            exit 0
          fi

          if [ "${FINAL_FOUND}" -eq 1 ]; then
            echo "Final two-hour movie artifact exists and is retained."
          else
            echo "All 24 part artifacts found; final assembly status requires another check."
          fi

      - name: Record the recovery result
        if: always()
        run: echo "Watchdog has inspected per-part artifacts and active jobs, and automatically dispatched missing renders or final assembly when required."
