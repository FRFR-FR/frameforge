name: Download authorized YouTube Shorts

on:
  workflow_dispatch:
    inputs:
      confirm_rights_and_public_artifact:
        description: "I own or have permission to download/reuse every listed video, and I understand the artifact is temporarily accessible to anyone with access to this PUBLIC repository."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  download:
    if: ${{ inputs.confirm_rights_and_public_artifact == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out Frameforge
        uses: actions/checkout@v4

      - name: Install system dependencies (FFmpeg and FFprobe)
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg ca-certificates
          ffmpeg -version
          ffprobe -version

      - name: Set up Deno JavaScript runtime
        uses: denoland/setup-deno@v2

      - name: Verify Deno runtime
        run: deno --version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ytdlp.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade -r requirements-ytdlp.txt
          python -m yt_dlp --version

      - name: Verify media tools
        run: |
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -hide_banner -version
          ffprobe -hide_banner -version

      - name: Download the five Shorts sequentially
        env:
          FRAMEFORGE_VIDEO_RIGHTS_CONFIRMED: "yes"
        run: python tools/download_youtube_shorts.py --output-dir downloads/youtube-shorts

      - name: Package downloads as a short-lived artifact
        uses: actions/upload-artifact@v4
        with:
          name: frameforge-youtube-shorts-${{ github.run_number }}
          path: downloads/youtube-shorts/
          if-no-files-found: error
          retention-days: 1
