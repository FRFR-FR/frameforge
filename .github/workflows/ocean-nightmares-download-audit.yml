name: Ocean Nightmares — download and audit NOAA candidates

on:
  push:
    paths:
      - ".github/workflows/ocean-nightmares-download-audit.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

env:
  TARGET_CLIP_COUNT: "30"
  MAX_STILL_IMAGE_FALLBACKS: "10"

jobs:
  download-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out FrameForge
        uses: actions/checkout@v4

      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq python3-pil

      - name: Download NOAA candidates one at a time; skip unavailable items and continue
        shell: bash
        run: |
          set -euo pipefail
          target_clip_count="${TARGET_CLIP_COUNT:-30}"
          max_still_fallbacks="${MAX_STILL_IMAGE_FALLBACKS:-10}"
          downloaded_unique_hash_count=0
          declare -A seen_hashes=()
          mkdir -p work/noaa-media work/contact-sheets work/noaa-image-fallbacks
          cat > work/sources.tsv <<'EOF'
          noaa-isopod-01|Giant isopod|https://oceanexplorer.noaa.gov/wp-content/uploads/2014/03/isopod-1280x720-2.mp4
          noaa-isopod-02|Giant isopod|https://oceanexplorer.noaa.gov/wp-content/uploads/2019/11/dive11-isopod-1280x720-1.mp4
          noaa-isopod-03|Isopod (species unconfirmed)|https://oceanexplorer.noaa.gov/wp-content/uploads/2021/04/ex1605l3-isopod2.mp4
          noaa-isopod-04|Isopod (species unconfirmed)|https://oceanexplorer.noaa.gov/wp-content/uploads/2021/03/ex1803-isopod-legs.mp4
          noaa-isopod-05|Water Walker isopod (Munnopsidae; not giant isopod)|https://oceanexplorer.noaa.gov/wp-content/uploads/2025/05/dive05-waterwalker-1280x720-1.mp4
          noaa-isopod-06|Unknown isopod (species unconfirmed; Mariana 2016)|https://oceanexplorer.noaa.gov/wp-content/uploads/2021/02/ex1605l3-isopod.mp4
          noaa-anglerfish-01|Schaefer's anglerfish|https://oceanexplorer.noaa.gov/wp-content/uploads/2019/11/dive12-anglerfish-1280x720-1.mp4
          noaa-anglerfish-07|Schaefer's anglerfish alternate NOAA upload (check for duplicate footage)|https://oceanexplorer.noaa.gov/wp-content/uploads/2026/09/dive12-anglerfish-1280x720-1.mp4
          noaa-anglerfish-02|Deep-sea anglerfish|https://oceanexplorer.noaa.gov/wp-content/uploads/2025/05/one-of-my-favorites-1920x1080-2.mp4
          noaa-anglerfish-03|Deep-sea anglerfish|https://oceanexplorer.noaa.gov/wp-content/uploads/2021/04/ex1711-goosefish1.mp4
noaa-anglerfish-11|Gutsy Goosefish (Deep-sea anglerfish; Dive 04, 2017)|https://archive.oceanexplorer.noaa.gov/okeanos/explorations/ex1703/dailyupdates/media/video/dive04_goosefish/goosefish_1280x720.mp4
          noaa-anglerfish-04|Deep-sea anglerfish|https://oceanexplorer.noaa.gov/wp-content/uploads/2021/02/ex1605-pizzafish.mp4
          noaa-anglerfish-05|Deep-sea anglerfish (Grumpy Goosefish)|https://oceanexplorer.noaa.gov/wp-content/uploads/2019/11/dive02-goosefish-1280x720-1.mp4
          noaa-dragonfish-01|Black dragonfish candidate|https://oceanexplorer.noaa.gov/wp-content/uploads/2019/11/dive04-dragonfish-1280x720-1.mp4
          noaa-anglerfish-06|Goosefish (2021 ROV Shakedown; resolve NOAA page)|https://oceanexplorer.noaa.gov/multimedia/okeanos-explorations-ex2103-gallery-media-goosefish-video/
          noaa-anglerfish-08|Rosy coffinfish (Chaunax; deep-sea anglerfish family)|https://oceanexplorer.noaa.gov/wp-content/uploads/2021/11/dive05-coffinfish-1280x720-1.mp4
          noaa-anglerfish-10|Chaunacops anglerfish (Deep Connections 2019 Dive 02)|https://oceanexplorer.noaa.gov/wp-content/uploads/2025/05/one-of-my-favorites-1920x1080-1.mp4
          noaa-anglerfish-09|Fish of the Deep compilation (goosefish is linked as a featured species; verify frames before counting)|https://oceanexplorer.noaa.gov/wp-content/uploads/2018/05/fish_deep_1280x720.mp4
          EOF

          cat > work/image-fallbacks.tsv <<'EOF'
          fallback-barreleye|Barreleye fish|https://oceanexplorer.noaa.gov/wp-content/uploads/2024/08/barreleye-fish.jpg|https://oceanexplorer.noaa.gov/multimedia/explorations-24skq-ak-seamounts-gallery-media-barreleye/
          fallback-gulper-eel|Pelican/gulper eel (Eurypharynx pelecanoides)|https://oceanexplorer.noaa.gov/wp-content/uploads/2025/05/eel-hires.jpg|https://oceanexplorer.noaa.gov/multimedia/explorations-19biolum-logs-jun18-media-eel/
          fallback-viperfish|Viperfish|https://oceanexplorer.noaa.gov/wp-content/uploads/2022/03/ex2104-viperfish-1920x1080-1.jpg|https://oceanexplorer.noaa.gov/multimedia/viperfish/
          fallback-vampire-squid|Vampire squid|https://oceanexplorer.noaa.gov/wp-content/uploads/2025/04/vampire-squid-hires.jpg|https://oceanexplorer.noaa.gov/multimedia/explorations-19biolum-background-cephalopods-media-vampire-squid/
          EOF

          printf 'id|species_segment|url|download_status|bytes|duration_seconds|width|height|frame_audit_status\n' > work/download-audit.tsv
          # STRICTLY SERIAL: finish (or skip) this candidate before starting the next row.
          # Missing/invalid candidates are recorded for manual follow-up; they never stop the queue.
          while IFS='|' read -r id species url; do
            [ -n "$id" ] || continue
            file="work/noaa-media/${id}.mp4"
            status="SKIPPED_DOWNLOAD_FAILED"
            if [[ "$url" == *".mp4" ]]; then
              media_url="$url"
            else
              page_file="work/noaa-media/${id}.source.html"
              media_url=""
              if curl --fail --location --retry 3 --retry-all-errors --connect-timeout 30 --max-time 180 "$url" -o "$page_file"; then
                media_url=$(python - "$page_file" <<'PY'
          import re, sys, html
          s=open(sys.argv[1],encoding="utf-8",errors="ignore").read()
          s=html.unescape(s).replace("\\/", "/")
          candidates=re.findall(r'https?://[^\\"\'<> ]+?\.mp4(?:\?[^\\"\'<> ]*)?',s,re.I)
          candidates += re.findall(r'(?<![A-Za-z0-9])(?:src|content)=["\']([^"\']+\.mp4(?:\?[^"\']*)?)["\']',s,re.I)
          for u in candidates:
              if u.startswith("//"): u="https:"+u
              if u.startswith("/"): u="https://oceanexplorer.noaa.gov"+u
              if "oceanexplorer.noaa.gov" in u:
                  print(u); break
          PY
                )
              fi
              if [ -z "$media_url" ]; then
                status="SKIPPED_NO_DIRECT_MATCH"
                echo "SKIPPED: no direct NOAA MP4 link could be resolved from $url"
              fi
            fi
            bytes=0 duration="" width="" height="" frame_status="not_available"
            if [ -n "$media_url" ] && curl --fail --location --retry 4 --retry-all-errors --connect-timeout 30 --max-time 900 "$media_url" -o "$file"; then
              if ffprobe -v error -select_streams v:0 -show_entries stream=width,height,duration -of json "$file" > "work/noaa-media/${id}.ffprobe.json"; then
                status="DOWNLOADED_PENDING_REVIEW"
                bytes=$(stat -c%s "$file")
                duration=$(jq -r '.streams[0].duration // empty' "work/noaa-media/${id}.ffprobe.json")
                width=$(jq -r '.streams[0].width // empty' "work/noaa-media/${id}.ffprobe.json")
                height=$(jq -r '.streams[0].height // empty' "work/noaa-media/${id}.ffprobe.json")
                mkdir -p "work/contact-sheets/${id}"
                # Extract a small set of evenly spaced frames for human species verification.
                dur=${duration:-0}
                if awk "BEGIN {exit !($dur > 0)}"; then
                  for pct in 10 35 60 85; do
                    ts=$(awk -v d="$dur" -v p="$pct" 'BEGIN {printf "%.3f", d*p/100}')
                    ffmpeg -hide_banner -loglevel error -ss "$ts" -i "$file" -frames:v 1 -vf "scale=640:-1" "work/contact-sheets/${id}/frame-${pct}.jpg" || true
                  done
                fi
                if find "work/contact-sheets/${id}" -name '*.jpg' -print -quit | grep -q .; then
                  frame_status="frames_extracted_pending_human_species_review"
                fi
              else
                status="SKIPPED_INVALID_VIDEO"
                rm -f "$file"
                echo "SKIPPED: downloaded file did not pass FFprobe: $id"
              fi
            elif [ -n "$media_url" ]; then
              echo "SKIPPED: download failed for $id; moving to the next candidate"
            fi
            if [ "$status" = "DOWNLOADED_PENDING_REVIEW" ]; then
              candidate_hash=$(sha256sum "$file" | awk '{print $1}')
              if [[ -n "${seen_hashes[$candidate_hash]+x}" ]]; then
                status="SKIPPED_DUPLICATE_HASH"
                rm -f "$file"
                rm -rf "work/contact-sheets/$id"
                bytes=0
                frame_status="not_available"
              else
                seen_hashes["$candidate_hash"]=1
                downloaded_unique_hash_count=$((downloaded_unique_hash_count+1))
              fi
            fi
            printf '%s|%s|%s|%s|%s|%s|%s|%s|%s\n' "$id" "$species" "$url" "$status" "$bytes" "$duration" "$width" "$height" "$frame_status" >> work/download-audit.tsv
            if [ "$downloaded_unique_hash_count" -ge "$target_clip_count" ]; then
              echo "Reached the $target_clip_count-file-hash target; stopping the serial candidate queue."
              break
            fi
          done < work/sources.tsv

          printf 'id|species|direct_url|source_page|download_status|bytes|mime_type\n' > work/image-fallback-audit.tsv
          image_fallback_count=0
          while IFS='|' read -r id species image_url source_page; do
            [ -n "$id" ] || continue
            if [ "$image_fallback_count" -ge "$max_still_fallbacks" ]; then
              echo "Reached the still-image fallback limit ($max_still_fallbacks); stopping image fallback downloads."
              break
            fi
            image_file="work/noaa-image-fallbacks/${id}.jpg"
            image_status="SKIPPED_DOWNLOAD_FAILED"
            image_bytes=0
            mime_type=""
            if curl --fail --location --retry 2 --retry-all-errors --connect-timeout 30 --max-time 180 "$image_url" -o "$image_file"; then
              mime_type=$(file --brief --mime-type "$image_file")
              if [[ "$mime_type" == image/* ]]; then
                image_status="DOWNLOADED_STILL_FALLBACK_NOT_A_VIDEO"
                image_bytes=$(stat -c%s "$image_file")
                image_fallback_count=$((image_fallback_count+1))
              else
                rm -f "$image_file"
                image_status="SKIPPED_NOT_AN_IMAGE"
              fi
            fi
            printf '%s|%s|%s|%s|%s|%s|%s\n' "$id" "$species" "$image_url" "$source_page" "$image_status" "$image_bytes" "$mime_type" >> work/image-fallback-audit.tsv
          done < work/image-fallbacks.tsv

      - name: Create contact sheet and audit summary
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, csv, os
          from PIL import Image, ImageOps, ImageDraw
          root=Path("work")
          files=list((root/"contact-sheets").glob("*/*.jpg"))
          thumbs=[]
          for p in files:
              im=Image.open(p).convert("RGB")
              im.thumbnail((320,190))
              canvas=Image.new("RGB",(340,225),"white")
              canvas.paste(im,((340-im.width)//2,5))
              ImageDraw.Draw(canvas).text((8,200),f"{p.parent.name} / {p.stem}",fill="black")
              thumbs.append(canvas)
          if thumbs:
              cols=2; rows=(len(thumbs)+cols-1)//cols
              sheet=Image.new("RGB",(cols*340,rows*225),(235,235,235))
              for i,im in enumerate(thumbs): sheet.paste(im,((i%cols)*340,(i//cols)*225))
              sheet.save(root/"NOAA-contact-sheet.jpg",quality=88)
          rows=[]
          with open(root/"download-audit.tsv") as f:
              rows=list(csv.DictReader(f,delimiter="|"))
          target=int(os.environ.get("TARGET_CLIP_COUNT","30"))
          downloaded=sum(r["download_status"]=="DOWNLOADED_PENDING_REVIEW" for r in rows)
          image_rows=[]
          image_audit=root/"image-fallback-audit.tsv"
          if image_audit.exists():
              with open(image_audit) as f: image_rows=list(csv.DictReader(f,delimiter="|"))
          report={
            "project":"Ocean Nightmares",
            "target_clip_count":target,
            "downloaded_distinct_file_hashes_pending_species_review":downloaded,
            "remaining_video_downloads_to_target":max(0,target-downloaded),
            "still_image_fallback_count":sum(r["download_status"]=="DOWNLOADED_STILL_FALLBACK_NOT_A_VIDEO" for r in image_rows),
            "still_images_count_toward_video_target":False,
            "candidate_scope":"NOAA video candidates are processed strictly one at a time. The queue stops at 30 distinct SHA-256 file hashes. Hash uniqueness does not prove that two differently encoded files show different footage; contact sheets still require human review.",
            "downloaded_count":downloaded,
            "skipped_count":sum(r["download_status"].startswith("SKIPPED") for r in rows),
            "frame_sets_extracted":sum(r["frame_audit_status"]!="not_available" for r in rows),
            "species_approval":"NOT AUTOMATIC: contact sheets require human visual review",
            "source_search_note":"NOAA Ocean Exploration pages confirm the current candidates. The separate NCEI Ocean Exploration Video Portal is the documented route for searching archived ROV segments, streams, and highlights, but its page currently reports heavy usage; no unverified portal records were inserted.",
            "video_gap_species":["Barreleye fish","Frilled shark","Vampire squid","Gulper eel","Viperfish","Goblin shark","Colossal squid"],
            "manual_followup_species":["Barreleye fish","Frilled shark","Vampire squid","Gulper eel","Viperfish","Goblin shark","Colossal squid"],
            "manual_followup_note":"Search the NOAA Ocean Exploration Video Portal for each exact species/accepted synonym and add a clip only when the observation metadata confirms the animal. Do not substitute another species. The four NOAA stills are fallback-only and do not count toward the 30 videos.",
            "image_fallbacks":image_rows,
            "items":rows
          }
          (root/"audit-summary.json").write_text(json.dumps(report,indent=2))
          with open(root/"manual-download-queue.txt","w") as out:
              out.write("OCEAN NIGHTMARES — MANUAL FOOTAGE FOLLOW-UP\n")
              out.write(f"Video target: {target} distinct file hashes; downloaded pending review: {downloaded}; remaining: {max(0,target-downloaded)}.\n")
              out.write("Only exact-species NOAA footage is acceptable. Do not substitute species.\n")
              out.write("NOAA archive search route: https://www.ncei.noaa.gov/access/ocean-exploration/video/ (search exact species keywords; use segment/stream/highlight filters; check observation annotations before adding a clip).\n\n")
              for r in rows:
                  if r["download_status"].startswith("SKIPPED"):
                      out.write(f'SKIPPED CANDIDATE: {r["id"]} | {r["species_segment"]} | {r["download_status"]} | source: {r["url"]}\n')
              out.write("\nTARGET SPECIES WITH NO CANDIDATE IN THIS QUEUE:\n")
              for species in report["manual_followup_species"]:
                  out.write(f"- {species}\n")
              out.write("\nSTILL-IMAGE FALLBACKS (NOT VIDEO CLIPS; DO NOT COUNT TOWARD 30):\n")
              for r in image_rows:
                  if r["download_status"]=="DOWNLOADED_STILL_FALLBACK_NOT_A_VIDEO":
                      out.write(f'- {r["species"]} | {r["direct_url"]} | credit/source: {r["source_page"]}\n')
          PY

      - name: Upload Rosy Coffinfish candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ocean-nightmares-rosy-coffinfish
          path: |
            work/noaa-media/noaa-anglerfish-08.mp4
            work/contact-sheets/noaa-anglerfish-08/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Fish of the Deep candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ocean-nightmares-fish-of-the-deep
          path: |
            work/noaa-media/noaa-anglerfish-09.mp4
            work/contact-sheets/noaa-anglerfish-09/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Chaunacops anglerfish candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ocean-nightmares-chaunacops-anglerfish
          path: |
            work/noaa-media/noaa-anglerfish-10.mp4
            work/contact-sheets/noaa-anglerfish-10/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Gutsy Goosefish candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ocean-nightmares-gutsy-goosefish
          path: |
            work/noaa-media/noaa-anglerfish-11.mp4
            work/contact-sheets/noaa-anglerfish-11/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload new candidate audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ocean-nightmares-new-candidate-audit
          path: |
            work/download-audit.tsv
            work/image-fallback-audit.tsv
            work/audit-summary.json
            work/manual-download-queue.txt
          if-no-files-found: warn
          retention-days: 14
