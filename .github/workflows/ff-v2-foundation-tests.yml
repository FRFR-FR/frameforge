name: FrameForge V2 Foundation Validation

on:
  push:
    branches: [main]
    paths:
      - "schemas/**"
      - "examples/**"
      - "tests/**"
      - "ff-v2-core.js"
      - "ff-v2-audio.js"
      - "ff-v2-director.js"
      - "ff-v2-production.js"
      - "ff-v2-production-ui.js"
      - "ff-v2-render-queue.js"
      - "ff-v2-studio.js"
      - "tools/mux_ffmpeg.py"
      - "tools/merge_render_chunks.py"
      - "tools/export_ffmpeg.py"
      - "tools/qa_render.py"
      - "tools/create_review.py"
      - "tools/package_delivery.py"
      - "tools/manual_ops.py"
      - "projects/v2-pilots/**"
      - "tests/test_render_pipeline.py"
      - "tests/test_manual_ops.py"
      - "tests/test_v2_pilots.py"
      - "tests/test_mux_ffmpeg.py"
      - "ff-v2-renderer.js"
      - "ff-v2-3d-studio.js"
      - "vendor/three/0.164.1/**"
      - "ff-v2-shaders.js"
      - "index.html"
      - "app.js"
      - "styles.css"
      - "tools/validate_project.py"
      - "tools/validate_media_manifest.py"
      - "requirements-dev.txt"
      - ".github/workflows/ff-v2-foundation-tests.yml"
  pull_request:
    paths:
      - "schemas/**"
      - "examples/**"
      - "tests/**"
      - "ff-v2-core.js"
      - "ff-v2-studio.js"
      - "ff-v2-director.js"
      - "ff-v2-production.js"
      - "ff-v2-production-ui.js"
      - "index.html"
      - "app.js"
      - "styles.css"
      - "tools/validate_project.py"
      - "tools/validate_media_manifest.py"
      - "requirements-dev.txt"
      - ".github/workflows/ff-v2-foundation-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ff-v2-foundation-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-foundations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out FrameForge
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install pinned validation dependency
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Syntax-check existing editor and production scripts
        run: |
          node --check app.js
          node --check frameforge-3d.js
          node --check ff-v2-core.js
          node --check ff-v2-audio.js
          node --check ff-v2-director.js
          node --check ff-v2-production.js
          node --check ff-v2-production-ui.js
          node --check ff-v2-render-queue.js
          node --check ff-v2-studio.js
          node --check ff-v2-renderer.js
          node --check ff-v2-3d-studio.js
          node --check ff-v2-shaders.js
          node --test tests/ff-v2-core.test.js tests/ff-v2-renderer.test.js tests/ff-v2-audio.test.js tests/ff-v2-director.test.js tests/ff-v2-production.test.js
          python -m compileall -q blender_pipeline brown_film minecraft_pipeline projects tools tests

      - name: Ensure FFmpeg is available for mux integration test
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: Validate schemas, examples and semantic rules
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v
          python tools/validate_project.py examples/frameforge-project-v2.example.json
          python tools/validate_media_manifest.py examples/media-asset-manifest.example.json
