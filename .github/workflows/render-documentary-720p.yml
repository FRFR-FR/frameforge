name: Render documentary (720p only, B-roll + Kokoro Echo)

on:
  push:
    branches:
      - "youtube-docs/**"
    paths:
      - "youtube-channel/episodes/**"
      - "youtube-channel/tools/**"
      - ".github/workflows/render-documentary-720p.yml"
  workflow_dispatch:
    inputs:
      episode_directory:
        description: "Episode folder, e.g. youtube-channel/episodes/EP001 (blank selects latest)"
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: documentary-render-${{ github.ref }}-${{ contains(github.event.head_commit.message || '', '[compress-360p-only]') && 'compress360' || 'master' }}
  cancel-in-progress: false

jobs:
  render:
    if: ${{ !contains(github.event.head_commit.message || '', '[compress-360p-only]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      HF_HOME: ~/.cache/huggingface

    steps:
      - name: Check out episode source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Kokoro model and Pixabay search cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/pixabay
          key: documentary-kokoro-echo-${{ runner.os }}-${{ hashFiles('youtube-channel/tools/generate_kokoro.py') }}
          restore-keys: |
            documentary-kokoro-echo-${{ runner.os }}-

      - name: Install system and Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng libsndfile1 fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install "kokoro>=0.9.4" soundfile numpy requests

      - name: Select episode folder
        id: episode
        shell: bash
        run: |
          set -euo pipefail
          REQUESTED="${{ inputs.episode_directory }}"
          if [ -n "$REQUESTED" ]; then
            EPISODE_DIR="$REQUESTED"
          else
            EPISODE_DIR="$(find youtube-channel/episodes -mindepth 2 -maxdepth 2 -name render_episode.py -printf '%h\n' | sort -V | tail -n 1)"
          fi
          test -n "$EPISODE_DIR" || { echo "::error::No episode folder containing render_episode.py was found."; exit 1; }
          test -f "$EPISODE_DIR/narration.md" || { echo "::error::Missing narration.md in $EPISODE_DIR"; exit 1; }
          echo "dir=$EPISODE_DIR" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$(basename "$EPISODE_DIR")" >> "$GITHUB_OUTPUT"
          echo "Selected $EPISODE_DIR"

      - name: Generate approved Kokoro Echo narration
        env:
          EPISODE_DIR: ${{ steps.episode.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          python youtube-channel/tools/generate_kokoro.py --episode-dir "$EPISODE_DIR"

      - name: Acquire rights-documented B-roll sequentially
        id: broll
        env:
          EPISODE_DIR: ${{ steps.episode.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$PIXABAY_API_KEY" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            mkdir -p "$EPISODE_DIR/output"
            printf '%s\n' "Kokoro narration generated. Video rendering is blocked because PIXABAY_API_KEY is empty or unavailable. No slide-based substitute was created." > "$EPISODE_DIR/output/production_status.md"
            echo "::warning::PIXABAY_API_KEY is missing. Narration will still be packaged; video rendering is skipped rather than replaced with slides."
            exit 0
          fi
          python youtube-channel/tools/acquire_pixabay_broll.py --episode-dir "$EPISODE_DIR"
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Render B-roll-first documentary
        id: render
        if: steps.broll.outputs.available == 'true'
        env:
          EPISODE_DIR: ${{ steps.episode.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          python "$EPISODE_DIR/render_episode.py"

      - name: Validate exact 720p, Kokoro voice, B-roll ratio and full decode
        if: steps.broll.outputs.available == 'true' && steps.render.outcome == 'success'
        env:
          EPISODE_DIR: ${{ steps.episode.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          VIDEO="$(find "$EPISODE_DIR/output" -maxdepth 1 -type f -name "*_Kokoro_Broll_720p.mp4" | sort | tail -n 1)"
          test -n "$VIDEO" || { echo "::error::No B-roll + Kokoro 720p master found."; exit 1; }
          REPORT="$EPISODE_DIR/output/render_report_broll_echo.json"
          test -s "$VIDEO" || { echo "::error::Rendered MP4 is missing or empty."; exit 1; }
          test -s "$REPORT" || { echo "::error::Render report is missing."; exit 1; }
          python - "$VIDEO" "$REPORT" <<'PY'
          import json, subprocess, sys
          video, report_path = sys.argv[1:]
          report = json.load(open(report_path, encoding="utf-8"))
          meta = json.loads(subprocess.check_output([
              "ffprobe", "-v", "error", "-show_streams", "-show_format", "-of", "json", video
          ], text=True))
          v = next(s for s in meta["streams"] if s["codec_type"] == "video")
          a = next(s for s in meta["streams"] if s["codec_type"] == "audio")
          assert (v["width"], v["height"]) == (1280, 720), f"Only 1280x720 allowed, got {v.get('width')}x{v.get('height')}"
          assert v["codec_name"] == "h264", f"Expected H.264, got {v['codec_name']}"
          assert a["codec_name"] == "aac", f"Expected AAC, got {a['codec_name']}"
          assert a.get("sample_rate") == "48000", f"Expected 48kHz, got {a.get('sample_rate')}"
          assert v.get("avg_frame_rate") == "24/1", f"Expected measured 24fps, got {v.get('avg_frame_rate')}"
          assert report.get("narration_provider") == "Kokoro-82M", "Kokoro narration is mandatory"
          assert report.get("narration_voice_id") == "am_echo", "Echo voice is mandatory"
          coverage = float(report.get("broll_coverage_percent", 0))
          assert coverage >= 70, f"B-roll coverage {coverage}% is below 70% minimum"
          print(f"PASS: {video}; {int(meta['format']['size'])/1_000_000:.2f} MB; {float(meta['format']['duration']):.1f}s; B-roll {coverage:.1f}%")
          PY
          ffmpeg -v error -i "$VIDEO" -f null -
          echo "Full-file decode check passed."

      - name: Upload video, narration, source footage and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.episode.outputs.artifact_name }}-720p-broll-echo
          path: |
            ${{ steps.episode.outputs.dir }}/output/
            ${{ steps.episode.outputs.dir }}/asset-manifest-broll.csv
            ${{ steps.episode.outputs.dir }}/broll_acquisition_report.json
            ${{ steps.episode.outputs.dir }}/assets/broll/
          if-no-files-found: warn
          retention-days: 14

  compress_360p:
    if: ${{ contains(github.event.head_commit.message || '', '[compress-360p-only]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Download the existing 720p master artifact
        uses: actions/download-artifact@v4
        with:
          name: EP001-720p-broll-echo
          run-id: 45816307616
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: master_artifact

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Encode separate 360p low-bitrate copy
        shell: bash
        run: |
          set -euo pipefail
          MASTER="$(find master_artifact -type f -name 'Underneath_Everything_EP001_Kokoro_Broll_720p.mp4' -print -quit)"
          test -n "$MASTER" || { echo '720p master was not found in the original artifact'; exit 1; }
          mkdir -p compressed
          ffmpeg -hide_banner -y -i "$MASTER" -vf "fps=12,scale=640:360:flags=bicubic,setsar=1" -c:v libx264 -preset slow -profile:v baseline -level 3.0 -b:v 180k -maxrate 210k -bufsize 360k -pix_fmt yuv420p -c:a aac -b:a 40k -ac 1 -ar 32000 -movflags +faststart compressed/Underneath_Everything_EP001_360p_12fps_lowbitrate.mp4

      - name: Validate compressed copy
        shell: bash
        run: |
          set -euo pipefail
          VIDEO='compressed/Underneath_Everything_EP001_360p_12fps_lowbitrate.mp4'
          python - "$VIDEO" <<'PY'
          import json, subprocess, sys
          p = sys.argv[1]
          meta = json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-show_format','-of','json',p], text=True))
          v = next(s for s in meta['streams'] if s['codec_type'] == 'video')
          a = next(s for s in meta['streams'] if s['codec_type'] == 'audio')
          assert (v['width'], v['height']) == (640, 360), (v.get('width'), v.get('height'))
          assert v['avg_frame_rate'] == '12/1', v['avg_frame_rate']
          assert v['codec_name'] == 'h264'
          assert a['codec_name'] == 'aac'
          duration = float(meta['format']['duration'])
          assert 480 <= duration <= 485, duration
          size = int(meta['format']['size'])
          print(f'PASS: 640x360, 12fps, {duration:.2f}s, {size/1_000_000:.2f} MB')
          PY
          ffmpeg -v error -i "$VIDEO" -f null -

      - name: Upload only the compressed 360p MP4
        uses: actions/upload-artifact@v4
        with:
          name: EP001-360p-low-bitrate-12fps
          path: compressed/Underneath_Everything_EP001_360p_12fps_lowbitrate.mp4
          if-no-files-found: error
          retention-days: 14
