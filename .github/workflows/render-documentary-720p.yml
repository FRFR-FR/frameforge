name: Render documentary (720p B-roll + Kokoro Echo)

on:
  push:
    branches:
      - "youtube-docs/**"
    paths:
      - "youtube-channel/episodes/**"
      - "youtube-channel/tools/**"
      - ".github/workflows/render-documentary-720p.yml"
  workflow_dispatch:
    inputs:
      episode_directory:
        description: "Episode folder, e.g. youtube-channel/episodes/EP002 (blank selects latest)"
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: documentary-render-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      artifact_name: ${{ steps.episode.outputs.artifact_name }}
      video_ready: ${{ steps.validate.outputs.video_ready }}
    env:
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      DVIDS_API_KEY: ${{ secrets.DVIDS_API_KEY }}
      HF_HOME: ~/.cache/huggingface
      LIBGL_ALWAYS_SOFTWARE: "1"
      MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
      EGL_PLATFORM: surfaceless

    steps:
      - name: Check out episode source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Kokoro model and Pixabay search cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/pixabay
            ~/.cache/frameforge-footage
          key: documentary-kokoro-echo-${{ runner.os }}-${{ hashFiles('youtube-channel/tools/generate_kokoro.py') }}
          restore-keys: |
            documentary-kokoro-echo-${{ runner.os }}-

      - name: Install rendering and TTS dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1 fonts-dejavu-core xvfb libgl1 libegl1 libegl-mesa0 libglx-mesa0 libgbm1 libxkbcommon0 curl xz-utils
          # Install the official Blender binary; this CI build uses Eevee
          # with Mesa software OpenGL under Xvfb for headless 3D rendering.
          BLENDER_ARCHIVE="blender-5.0.1-linux-x64.tar.xz"
          BLENDER_BASE="https://download.blender.org/release/Blender5.0"
          CHECKSUM_FILE="/tmp/blender-5.0.1.sha256"
          curl --fail --location --retry 3 --retry-all-errors "$BLENDER_BASE/blender-5.0.1.sha256" --output "$CHECKSUM_FILE"
          EXPECTED_SHA="$(awk -v archive="$BLENDER_ARCHIVE" '
            {
              filename=$2
              sub(/^\*/, "", filename)
              sub(/^.*\//, "", filename)
              if (filename == archive) {
                print tolower($1)
                matches++
              }
            }
            END { if (matches != 1) exit 1 }
          ' "$CHECKSUM_FILE")" || {
            echo "::error::Could not find exactly one checksum entry for $BLENDER_ARCHIVE."
            cat "$CHECKSUM_FILE"
            exit 1
          }
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::The checksum entry for $BLENDER_ARCHIVE is malformed."
            exit 1
          fi
          BLENDER_VERIFIED=0
          for attempt in 1 2 3; do
            echo "Downloading Blender archive (attempt $attempt/3)."
            curl --fail --location --retry 3 --retry-all-errors "$BLENDER_BASE/$BLENDER_ARCHIVE" --output "/tmp/$BLENDER_ARCHIVE"
            if printf '%s  %s\n' "$EXPECTED_SHA" "/tmp/$BLENDER_ARCHIVE" | sha256sum --check -; then
              BLENDER_VERIFIED=1
              break
            fi
            echo "::warning::Blender archive checksum mismatch on attempt $attempt."
            rm -f "/tmp/$BLENDER_ARCHIVE"
            sleep 2
          done
          if [ "$BLENDER_VERIFIED" -ne 1 ]; then
            echo "::error::Blender archive did not pass SHA-256 verification after three downloads."
            exit 1
          fi
          tar -tJf "/tmp/$BLENDER_ARCHIVE" >/dev/null
          sudo tar -xJf "/tmp/$BLENDER_ARCHIVE" -C /opt
          sudo ln -sfn /opt/blender-5.0.1-linux-x64/blender /usr/local/bin/blender
          hash -r
          blender --version
          cat > /tmp/frameforge_eevee_preflight.py <<'PY'
          import bpy, os
          from mathutils import Vector
          scene = bpy.context.scene
          engines = {item.identifier for item in scene.render.bl_rna.properties["engine"].enum_items}
          print("AVAILABLE_RENDER_ENGINES", sorted(engines), flush=True)
          if "BLENDER_EEVEE" not in engines:
              raise RuntimeError(f"Blender Eevee renderer is unavailable: {sorted(engines)}")
          scene.render.engine = "BLENDER_EEVEE"
          eevee = getattr(scene, "eevee", None)
          if eevee is not None:
              if hasattr(eevee, "taa_render_samples"):
                  eevee.taa_render_samples = 4
              if hasattr(eevee, "use_gtao"):
                  eevee.use_gtao = False
              if hasattr(eevee, "use_soft_shadows"):
                  eevee.use_soft_shadows = False
          bpy.ops.mesh.primitive_cube_add(size=1, location=(0, 0, 0))
          bpy.ops.object.camera_add(location=(4, -6, 4))
          camera = bpy.context.object
          camera.rotation_euler = (Vector((0, 0, 0)) - camera.location).to_track_quat("-Z", "Y").to_euler()
          scene.camera = camera
          bpy.ops.object.light_add(type="AREA", location=(2, -3, 5))
          bpy.context.object.data.energy = 1000
          if hasattr(bpy.context.object.data, "use_shadow"):
              bpy.context.object.data.use_shadow = False
          scene.render.resolution_x = 128
          scene.render.resolution_y = 128
          scene.render.resolution_percentage = 100
          scene.render.image_settings.file_format = "PNG"
          scene.render.filepath = "/tmp/frameforge_eevee_preflight.png"
          bpy.ops.render.render(write_still=True)
          size = os.path.getsize(scene.render.filepath)
          print("EEVEE_RENDER_PREFLIGHT_PASS", size, flush=True)
          if size < 1000:
              raise RuntimeError("Eevee preflight image is unexpectedly small.")
          PY
          xvfb-run -a blender --background --factory-startup --python /tmp/frameforge_eevee_preflight.py
          test -s /tmp/frameforge_eevee_preflight.png
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install "kokoro>=0.9.4" soundfile numpy requests Pillow

      - name: Select episode folder
        id: episode
        shell: bash
        run: |
          set -euo pipefail
          REQUESTED="${{ inputs.episode_directory }}"
          if [ -n "$REQUESTED" ]; then
            EPISODE_DIR="$REQUESTED"
          else
            EPISODE_DIR="$(find youtube-channel/episodes -mindepth 2 -maxdepth 2 -name render_episode.py -printf '%h\n' | sort -V | tail -n 1)"
          fi
          test -n "$EPISODE_DIR" || { echo "::error::No episode folder containing render_episode.py was found."; exit 1; }
          test -f "$EPISODE_DIR/narration.md" || { echo "::error::Missing narration.md in $EPISODE_DIR"; exit 1; }
          echo "dir=$EPISODE_DIR" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$(basename "$EPISODE_DIR")" >> "$GITHUB_OUTPUT"
          echo "Selected $EPISODE_DIR"

      - name: Generate approved Kokoro Echo narration
        id: narration
        env:
          EPISODE_DIR: ${{ steps.episode.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          python youtube-channel/tools/generate_kokoro.py --episode-dir "$EPISODE_DIR"
          test -s "$EPISODE_DIR/output/narration_echo_kokoro.wav"
          test -s "$EPISODE_DIR/output/narration_echo_kokoro.mp3"

      - name: Acquire relevant, rights-documented footage from all enabled providers
        id: broll
        env:
          EPISODE_DIR: ${{ steps.episode.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EPISODE_DIR/output"
          python -m py_compile youtube-channel/tools/acquire_multi_source_broll.py youtube-channel/tools/acquire_pixabay_broll.py
          python youtube-channel/tools/acquire_multi_source_broll.py --episode-dir "$EPISODE_DIR"
          test -s "$EPISODE_DIR/asset-manifest-broll.csv"
          test -s "$EPISODE_DIR/broll_acquisition_report.json"
          test -s "$EPISODE_DIR/output/footage_attribution_description.txt"
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Build per-clip visual-review contact sheets
        if: steps.broll.outputs.available == 'true'
        env:
          EPISODE_DIR: ${{ steps.episode.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          python youtube-channel/tools/create_broll_review_sheets.py --episode-dir "$EPISODE_DIR"

      - name: Render footage-first 720p documentary
        id: render
        if: steps.broll.outputs.available == 'true'
        env:
          EPISODE_DIR: ${{ steps.episode.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          python "$EPISODE_DIR/render_episode.py"

      - name: Validate master, footage coverage, no-caption rule and full decode
        id: validate
        if: steps.broll.outputs.available == 'true' && steps.render.outcome == 'success'
        env:
          EPISODE_DIR: ${{ steps.episode.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          VIDEO="$EPISODE_DIR/output/Underneath_Everything_EP002_Kokoro_Broll_720p.mp4"
          REPORT="$EPISODE_DIR/output/render_report_broll_echo.json"
          test -s "$VIDEO" || { echo "::error::720p master is missing."; exit 1; }
          test -s "$REPORT" || { echo "::error::Render/QC report is missing."; exit 1; }
          test -s "$EPISODE_DIR/output/narration_echo_kokoro.wav"
          test -s "$EPISODE_DIR/output/narration_echo_kokoro.mp3"
          test -s "$EPISODE_DIR/output/thumbnail_rwb.png"
          test -s "$EPISODE_DIR/output/qc_contact_sheet.jpg"
          test -s "$EPISODE_DIR/asset-manifest-broll.csv"
          test -s "$EPISODE_DIR/broll_acquisition_report.json"
          CONTACT_SHEETS="$(find "$EPISODE_DIR/output/broll_review" -maxdepth 1 -name '*_contact_sheet.jpg' | wc -l)"
          test "$CONTACT_SHEETS" -ge 10 || { echo "::error::Expected ten per-section B-roll review contact sheets."; exit 1; }
          python - "$VIDEO" "$REPORT" "$EPISODE_DIR" <<'PY'
          import json, os, subprocess, sys
          video, report_path, episode_dir = sys.argv[1:]
          report = json.load(open(report_path, encoding="utf-8"))
          acquisition = json.load(open(os.path.join(episode_dir, "broll_acquisition_report.json"), encoding="utf-8"))
          section_counts = acquisition.get("sections", {})
          assert int(acquisition.get("minimum_clips_per_section", 0)) >= 6, "B-roll acquisition minimum must be six clips per section"
          assert len(section_counts) == 10 and all(int(count) >= 6 for count in section_counts.values()), f"Every one of the ten sections must have at least six acquired clips: {section_counts}"
          meta = json.loads(subprocess.check_output(
              ["ffprobe", "-v", "error", "-show_streams", "-show_format", "-of", "json", video],
              text=True
          ))
          v = next(s for s in meta["streams"] if s["codec_type"] == "video")
          a = next(s for s in meta["streams"] if s["codec_type"] == "audio")
          assert (v["width"], v["height"]) == (1280, 720), "Master must be exactly 1280x720"
          assert v["codec_name"] == "h264" and v.get("avg_frame_rate") == "24/1", "Master must be measured H.264 24fps"
          assert a["codec_name"] == "aac" and a.get("sample_rate") == "48000" and int(a.get("channels", 0)) == 2, "Audio must be stereo AAC 48kHz"
          assert not any(s["codec_type"] == "subtitle" for s in meta["streams"]), "MP4 must not contain a subtitle stream"
          assert report.get("narration_provider") == "Kokoro-82M" and report.get("narration_voice_id") == "am_echo", "Kokoro Echo is mandatory"
          assert report.get("captions") == "none", "Captions/subtitles must not be included"
          assert report.get("chapter_labels") is True and report.get("channel_bug") is True, "Brand overlays are required"
          coverage = float(report.get("broll_coverage_percent", 0))
          graphics = float(report.get("graphics_percent", 0))
          assert 75 <= coverage <= 85, f"Measured B-roll share {coverage}% is outside the 75-85% target"
          assert 15 <= graphics <= 25, f"Motion-graphics share {graphics}% is outside the 15-25% target"
          assert int(report.get("unique_broll_clips", 0)) >= 40, "At least 40 unique relevant clips are required"
          assert int(report.get("subject_specific_clips", 0)) >= 10, "At least ten subject-specific clips are required"
          assert int(report.get("subject_specific_sections", 0)) >= 8, "Subject-specific footage must appear in at least eight sections"
          assert int(report.get("max_source_clip_uses", 99)) <= 2, "A source clip was reused more than twice"
          assert report.get("full_decode_check") == "PASS", "Full-file decode did not pass"
          assert report.get("audio_level_check", {}).get("status") == "PASS", "Narration audio-level check did not pass"
          assert report.get("freeze_detection", {}).get("longest_freeze_seconds", 99) <= 4.0, "Frozen frame exceeded four seconds"
          assert int(report.get("rights_records_count", 0)) >= 60, "Rights manifest must contain at least six clips for each of ten sections"
          assert int(report.get("broll_contact_sheets_count", 0)) >= 10, "Per-section B-roll visual-review sheets are missing"
          assert report.get("public_release_status", "").startswith("NOT APPROVED"), "Human approval lock must remain active"
          for name in (report["narration_wav"], report["narration_mp3"]):
              assert os.path.isfile(os.path.join(episode_dir, "output", name)), f"Missing deliverable: {name}"
          print(
              f"PASS: {video}; {int(meta['format']['size'])/1_000_000:.2f} MB; "
              f"{float(meta['format']['duration']):.1f}s; {coverage:.1f}% B-roll; "
              f"{graphics:.1f}% 3D; {report['unique_broll_clips']} unique clips"
          )
          PY
          ffmpeg -v error -i "$VIDEO" -f null -
          echo "720p full-file decode check passed."
          echo "video_ready=true" >> "$GITHUB_OUTPUT"

      - name: Record failed or blocked run status
        if: failure()
        env:
          EPISODE_DIR: ${{ steps.episode.outputs.dir }}
        shell: bash
        run: |
          if [ -n "$EPISODE_DIR" ]; then
            mkdir -p "$EPISODE_DIR/output"
            printf 'The automated render did not pass all steps. Check this workflow run for the exact failed step and error. No public-release approval is implied.\n' > "$EPISODE_DIR/output/production_status.md"
          fi

      - name: Upload master, narration, visual-review sheets and QC reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.episode.outputs.artifact_name || 'documentary' }}-720p-broll-echo-master
          path: |
            ${{ steps.episode.outputs.dir }}/output/Underneath_Everything_*_Kokoro_Broll_720p.mp4
            ${{ steps.episode.outputs.dir }}/output/narration_echo_kokoro.wav
            ${{ steps.episode.outputs.dir }}/output/narration_echo_kokoro.mp3
            ${{ steps.episode.outputs.dir }}/output/kokoro_narration_report.json
            ${{ steps.episode.outputs.dir }}/output/render_report_broll_echo.json
            ${{ steps.episode.outputs.dir }}/output/broll_timeline.json
            ${{ steps.episode.outputs.dir }}/output/thumbnail_rwb.png
            ${{ steps.episode.outputs.dir }}/output/qc_contact_sheet.jpg
            ${{ steps.episode.outputs.dir }}/output/broll_review/*.jpg
            ${{ steps.episode.outputs.dir }}/output/broll_review/review_index.json
            ${{ steps.episode.outputs.dir }}/output/production_report.md
            ${{ steps.episode.outputs.dir }}/output/production_status.md
            ${{ steps.episode.outputs.dir }}/asset-manifest-broll.csv
            ${{ steps.episode.outputs.dir }}/broll_acquisition_report.json
            ${{ steps.episode.outputs.dir }}/output/footage_attribution_description.txt
          if-no-files-found: warn
          retention-days: 14
