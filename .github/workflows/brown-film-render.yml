name: BROWN 5-Minute Part Render
on:
  push:
    branches: ["brown-film/part-*"]
    paths: ["brown_part.json"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: brown-part-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Read part number
        id: meta
        run: echo "part=$(python3 -c 'import json;print(json.load(open("brown_part.json"))["part"])')" >> "$GITHUB_OUTPUT"
      - name: Install Blender and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y blender ffmpeg
      - name: Render five-minute 3D animation
        run: |
          set -euo pipefail
          mkdir -p render
          blender -b -noaudio --python brown_film/render_part.py -- --config brown_part.json 2>&1 | tee render.log
          FILE=$(printf "render/part-%02d.mp4" "${{ steps.meta.outputs.part }}")
          ffmpeg -y -framerate 20 -start_number 1 -i render/frame_%04d.png -frames:v 6000 -c:v libx264 -preset slow -crf 16 -pix_fmt yuv420p -r 20 -an -movflags +faststart "$FILE"
          test -s "$FILE"
          ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=width,height,r_frame_rate,nb_read_frames -show_entries format=duration -of json "$FILE" | tee render/verification.json
      - uses: actions/upload-artifact@v4
        with:
          name: brown-part-${{ steps.meta.outputs.part }}
          path: |
            render/part-*.mp4
            render/verification.json
            render.log
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
