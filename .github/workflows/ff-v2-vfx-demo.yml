name: FrameForge V2 — Imported VFX Portrait Test

on:
  push:
    branches: [main]
    paths:
      - "tools/render_imported_vfx_demo.py"
      - "assets/external-vfx-manifest.json"
      - "docs/FF_V2_IMPORTED_VFX_POLICY.md"
      - "docs/FF_V2_VFX_AND_TRANSITIONS.md"
      - ".github/workflows/ff-v2-vfx-demo.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frameforge-v2-imported-vfx-demo
  cancel-in-progress: true

jobs:
  render-imported-vfx:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out FrameForge
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -n 2
          ffprobe -version | head -n 2

      - name: Install pinned cut-out and image dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "rembg[cpu]==2.0.88"

      - name: Download the Kremlin-sourced CC BY 4.0 portrait
        run: |
          mkdir -p artifacts/vfx-test/imported-vfx
          curl --fail --location --retry 3 \
            "https://upload.wikimedia.org/wikipedia/commons/a/a3/Vladimir_Putin_portrait_%282024-02-23%29.png" \
            --output artifacts/vfx-test/putin-original.png
          file artifacts/vfx-test/putin-original.png

      - name: Cut out the subject and download external VFX
        env:
          PIXABAY_API_KEY: \${{ secrets.PIXABAY_API_KEY }}
          OUTPUT_DIR: artifacts/vfx-test
        run: python tools/render_imported_vfx_demo.py

      - name: Verify video and transparent cut-out
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("artifacts/vfx-test")
          report = json.loads((root / "technical-report.json").read_text())
          video = root / report["render"]["file"]
          cutout = root / "putin-cutout-transparent.png"
          fire = root / "imported-vfx" / "pixabay-fire-simulation.mp4"
          assert video.is_file() and video.stat().st_size > 100_000
          assert cutout.is_file() and cutout.stat().st_size > 100_000
          assert fire.is_file() and fire.stat().st_size > 10_000
          assert report["subject_cutout"]["transparent_background"] is True
          assert report["processing"]["red_tint_target"] == "isolated transparent subject PNG only"
          assert report["processing"]["original_photo_background_tinted"] is False
          assert report["processing"]["repository_generated_fire_or_particles"] is False
          print(f"PASS: {report['render']['duration_seconds']:.3f}s, "
                f"{report['render']['width']}x{report['render']['height']}, "
                f"{report['render']['fps']} FPS, {report['render']['size_mb']:.2f} MB")
          print(f"PASS: transparent cut-out {cutout.stat().st_size / 1048576:.2f} MB")
          print(f"PASS: imported VFX {fire.stat().st_size / 1048576:.2f} MB")
          PY

      - name: Create preview frame
        run: |
          ffmpeg -hide_banner -y -ss 7 -i artifacts/vfx-test/frameforge-vfx-russia-president-10s-imported.mp4 \
            -frames:v 1 -q:v 2 artifacts/vfx-test/preview-final.jpg
          test -s artifacts/vfx-test/preview-final.jpg

      - name: Upload MP4, transparent cut-out, imported VFX source and credits
        uses: actions/upload-artifact@v4
        with:
          name: frameforge-vfx-imported-\${{ github.run_number }}
          path: artifacts/vfx-test/
          if-no-files-found: error
          retention-days: 7
