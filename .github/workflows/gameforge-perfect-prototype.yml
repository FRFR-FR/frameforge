name: GAMEFORGE Perfected Prototype Gate
on:
  push:
    branches: [gameforge-pvp-nextgen]
  schedule:
    - cron: "15 5 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Static completion gate
        shell: bash
        run: |
          set -euo pipefail
          test -f gameforge/pvp/project.godot
          test -f gameforge/pvp/scripts/pvp_game.gd
          test -f gameforge/pvp/scripts/pvp_actor.gd
          test -f gameforge/pvp/scripts/pvp_touch_overlay.gd
          test -f gameforge/pvp/QUALITY_CHECKLIST.md
          grep -q '1280' gameforge/pvp/project.godot || true
          if grep -RniE 'portrait|fixed.*movement|move.*button' gameforge/pvp/scripts; then
            echo "Potential legacy control/configuration detected; review required."
          fi
      - name: Repository asset audit
        shell: bash
        run: |
          set -euo pipefail
          find gameforge/pvp -type f | sort > /tmp/pvp_files.txt
          wc -l /tmp/pvp_files.txt
          grep -q 'pvp_game.gd' /tmp/pvp_files.txt
          grep -q 'pvp_actor.gd' /tmp/pvp_files.txt
          grep -q 'pvp_touch_overlay.gd' /tmp/pvp_files.txt
          echo "Asset inventory gate passed."
      - name: Completion report
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "# GAMEFORGE PERFECTED PROTOTYPE DAILY REPORT"
            echo
            echo "Commit: $GITHUB_SHA"
            echo "UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "The daily gate is intentionally blocking: a prototype cannot be called DONE merely because a build exists."
            echo
            echo "Required final gates:"
            echo "- physical player translation through map"
            echo "- responsive steering/camera/fire"
            echo "- detailed original operators and weapons"
            echo "- large navigable multi-lane map"
            echo "- real settings UI"
            echo "- landscape 1280x720 target"
            echo "- Android/Desktop launch"
            echo "- 30 FPS target test"
            echo "- no unresolved runtime/parser errors"
            echo "- final package and asset audit"
          } > GAMEFORGE_DAILY_ACCEPTANCE.md
      - uses: actions/upload-artifact@v4
        with:
          name: gameforge-daily-acceptance
          path: GAMEFORGE_DAILY_ACCEPTANCE.md
