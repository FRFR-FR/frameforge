name: FrameForge — Padlock Short Kokoro Echo Narration
run-name: Render padlock short with Kokoro Echo (am_echo)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/padlock-kokoro-echo.yml"
      - "projects/padlock-narrative/generate_echo.py"
      - "projects/padlock-narrative/narration.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frameforge-padlock-kokoro-echo
  cancel-in-progress: false

jobs:
  synthesize:
    name: Synthesize and verify 30-second Echo narration
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"

    steps:
      - name: Check out FrameForge
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Kokoro model weights
        uses: actions/cache@v4
        with:
          path: .cache/huggingface
          key: frameforge-kokoro-82m-am-echo-padlock-v1

      - name: Check FFmpeg and eSpeak NG
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v espeak-ng >/dev/null 2>&1; then
            sudo apt-get update -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
            sudo apt-get install --yes ffmpeg espeak-ng
          fi
          ffmpeg -version | head -n 1
          espeak-ng --version | head -n 1

      - name: Install CPU-only PyTorch and Kokoro
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0+cpu torchaudio==2.6.0+cpu
          python -m pip install "kokoro==0.9.4" "numpy==1.26.4" soundfile
          python - <<'PY'
          import torch, kokoro, soundfile
          print("torch", torch.__version__)
          print("Kokoro loaded")
          print("soundfile", soundfile.__version__)
          PY

      - name: Generate narration with Kokoro Echo
        run: python projects/padlock-narrative/generate_echo.py

      - name: Verify MP3, WAV master, voice and CTA timing
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d = Path("projects/padlock-narrative/output")
          meta = json.loads((d / "timing.json").read_text())
          mp3 = d / "padlock-narration-kokoro-echo.mp3"
          wav = d / "padlock-narration-kokoro-echo.wav"
          assert meta["status"] == "PASS", meta
          assert meta["voice"] == "Kokoro Echo (am_echo)", meta
          assert abs(meta["wav_duration_seconds"] - 30.0) < 1e-6, meta
          assert meta["cta_start_seconds"] == 10.0, meta
          assert meta["segment_count"] == 11, meta
          assert len(meta["segments"]) == 11, meta
          assert mp3.is_file() and mp3.stat().st_size > 50_000
          assert wav.is_file() and wav.stat().st_size > 100_000
          print("PADLOCK_KOKORO_ECHO_RENDER_VERIFIED")
          print(json.dumps(meta, indent=2))
          print("MP3 bytes:", mp3.stat().st_size)
          print("WAV bytes:", wav.stat().st_size)
          PY

      - name: Upload MP3, WAV master and timing report
        uses: actions/upload-artifact@v4
        with:
          name: FrameForge-Padlock-Kokoro-Echo-Narration
          path: |
            projects/padlock-narrative/output/padlock-narration-kokoro-echo.mp3
            projects/padlock-narrative/output/padlock-narration-kokoro-echo.wav
            projects/padlock-narrative/output/timing.json
          if-no-files-found: error
          retention-days: 30

      - name: Save generated narration into FrameForge
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/padlock-narrative/output/padlock-narration-kokoro-echo.mp3
          git add projects/padlock-narrative/output/timing.json
          if git diff --cached --quiet; then
            echo "No generated narration changes to commit."
          else
            git commit -m "Add generated Kokoro Echo padlock narration"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
