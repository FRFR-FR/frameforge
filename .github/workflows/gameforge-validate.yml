name: GAMEFORGE validation

on:
  push:
    branches: [gameforge-engine-foundation]
    paths:
      - "gameforge/**"
      - ".github/workflows/gameforge-validate.yml"
  pull_request:
    paths:
      - "gameforge/**"
      - ".github/workflows/gameforge-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate schemas and Godot runtime
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install schema validator
        run: python -m pip install --disable-pip-version-check jsonschema

      - name: Validate JSON schemas and defaults
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          schemas = [
              Path("gameforge/schemas/game-spec.schema.json"),
              Path("gameforge/integrations/frameforge/manifest.schema.json"),
          ]
          for path in schemas:
              schema = json.loads(path.read_text(encoding="utf-8"))
              Draft202012Validator.check_schema(schema)
              print(f"VALID schema: {path}")

          defaults = json.loads(Path("gameforge/config/defaults.json").read_text(encoding="utf-8"))
          assert defaults["generation_mode"] == "full_autopilot"
          assert defaults["quality_strategy"] == "adaptive"
          assert defaults["campaign"]["minimum_hours"] == 5
          assert defaults["campaign"]["maximum_hours"] == 10
          print("VALID defaults: full autopilot + adaptive quality")
          PY

      - name: Check runtime template structure
        run: |
          test -f gameforge/runtime/godot_template/project.godot
          test -f gameforge/runtime/godot_template/scenes/main.tscn
          for script in main player_controller gameforge_profile adaptive_resolution dialogue_timeline narrative_state audio_event_bus vfx_event_bus; do
            test -f "gameforge/runtime/godot_template/scripts/$script.gd"
          done

      - name: Set up pinned Godot editor
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: false

      - name: Import and parse Godot template headlessly
        run: godot --headless --path gameforge/runtime/godot_template --editor --quit

      - name: Check no obvious credentials are committed
        run: |
          if grep -RniE '(api[_-]?key|secret|password)[[:space:]]*[:=][[:space:]]*["'"'][^"'"']{12,}' gameforge --exclude='*.md'; then
            echo "Potential credential found. Review before merging."
            exit 1
          fi
