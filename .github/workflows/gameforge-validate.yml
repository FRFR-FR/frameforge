name: GAMEFORGE validation

on:
  push:
    branches: [gameforge-engine-foundation]
    paths:
      - "gameforge/**"
      - ".github/workflows/gameforge-validate.yml"
  pull_request:
    paths:
      - "gameforge/**"
      - ".github/workflows/gameforge-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate schemas, compiler, autopilot and Godot runtime
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install compiler dependencies
        run: python -m pip install --disable-pip-version-check -r gameforge/generator/brief_compiler/requirements.txt

      - name: Validate schemas, defaults and sample compilation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          for path in (
              Path("gameforge/schemas/game-spec.schema.json"),
              Path("gameforge/integrations/frameforge/manifest.schema.json"),
          ):
              schema = json.loads(path.read_text(encoding="utf-8"))
              Draft202012Validator.check_schema(schema)
              print(f"VALID schema: {path}")

          defaults = json.loads(Path("gameforge/config/defaults.json").read_text(encoding="utf-8"))
          assert defaults["generation_mode"] == "full_autopilot"
          assert defaults["quality_strategy"] == "adaptive"
          assert defaults["campaign"]["minimum_hours"] == 5
          assert defaults["campaign"]["maximum_hours"] == 10
          print("VALID defaults: full autopilot + adaptive quality")
          PY
          python gameforge/generator/brief_compiler/compile.py --spec gameforge/examples/sample-game-spec.json --out "$RUNNER_TEMP/gameforge-sample"

      - name: Test offline natural-language autopilot
        run: |
          PYTHONPATH=gameforge/generator/autopilot python -m unittest discover -s gameforge/generator/autopilot -p 'test_*.py' -v
          python gameforge/generator/autopilot/run.py --brief "Create a painterly mystery adventure called 'CI Test Game' about memory and family, 7 hours." --out "$RUNNER_TEMP/gameforge-autopilot"
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path(__import__("os").environ["RUNNER_TEMP"]) / "gameforge-autopilot"
          assert json.loads((root / "GAME_SPEC.json").read_text())["title"] == "CI Test Game"
          report = json.loads((root / "PIPELINE_REPORT.json").read_text())
          assert report["release_ready"] is False
          print("Autopilot artifacts generated and release gate remains closed.")
          PY

      - name: Check runtime template structure
        run: |
          test -f gameforge/runtime/godot_template/project.godot
          test -f gameforge/runtime/godot_template/scenes/main.tscn
          for script in main player_controller gameforge_profile adaptive_resolution dialogue_timeline narrative_state audio_event_bus vfx_event_bus world_generator third_person_camera interaction_component quest_director combat_component npc_brain frameforge_player quality_manager dialogue_director inventory_component save_manager interactable_base accessibility_settings; do
            test -f "gameforge/runtime/godot_template/scripts/$script.gd"
          done

      - name: Set up pinned Godot editor
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: false

      - name: Import and parse Godot template headlessly
        run: |
          godot --headless --path gameforge/runtime/godot_template --editor --quit
          godot --headless --path gameforge/runtime/godot_template --quit-after 3

      - name: Run Godot runtime smoke test
        run: godot --headless --path gameforge/runtime/godot_template --script res://tests/runtime_smoke.gd

      - name: Validate runtime contracts and FrameForge adapter
        run: |
          python gameforge/tests/validate_runtime.py
          PYTHONPATH=gameforge/integrations/frameforge python -m unittest discover -s gameforge/integrations/frameforge -p 'test_*.py' -v

      - name: Check for accidentally committed credentials
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          pattern = re.compile(r'''(?:api[_-]?key|secret|password)\s*[:=]\s*["'][^"']{12,}''', re.I)
          failures = []
          for path in Path("gameforge").rglob("*"):
              if path.is_file() and path.suffix in {".gd", ".json", ".py", ".cfg", ".yml"}:
                  for number, line in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
                      if pattern.search(line):
                          failures.append(f"{path}:{number}")
          if failures:
              raise SystemExit("Potential credentials found: " + ", ".join(failures))
          print("No obvious hardcoded credentials found.")
          PY
