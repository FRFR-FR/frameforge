name: GAMEFORGE validation

on:
  push:
    branches: [gameforge-cutscene-integration]
    paths:
      - "gameforge/**"
      - "setup/**"
      - ".gitignore"
      - ".github/workflows/gameforge-validate.yml"
      - ".github/workflows/gameforge-cloud.yml"
  pull_request:
    paths:
      - "gameforge/**"
      - "setup/**"
      - ".gitignore"
      - ".github/workflows/gameforge-validate.yml"
      - ".github/workflows/gameforge-cloud.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-contracts:
    name: Validate GAMEFORGE and cutscene contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install contract dependency
        run: python -m pip install --disable-pip-version-check jsonschema
      - name: Compile all cutscene Python modules
        run: python -m compileall -q gameforge/cutscenes
      - name: Run cutscene policy tests
        run: python -m unittest discover -s gameforge/cutscenes/tests -v
      - name: Check runtime integration
        run: python gameforge/tests/validate_runtime.py
      - name: Check GAMEFORGE autopilot
        run: |
          python -m pip install --disable-pip-version-check -r gameforge/generator/brief_compiler/requirements.txt
          PYTHONPATH=gameforge/generator/autopilot python -m unittest discover -s gameforge/generator/autopilot -p 'test_*.py' -v
      - name: Check GitHub cloud workflow is present and parses
        run: |
          test -s .github/workflows/gameforge-cloud.yml
          ruby -e 'require "yaml"; YAML.load_file(ARGV.fetch(0), aliases: true)' .github/workflows/gameforge-cloud.yml

  godot-runtime:
    name: Import Godot project and run runtime smoke tests
    needs: python-contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: false
      - name: Import and parse Godot template headlessly
        run: |
          godot --headless --path gameforge/runtime/godot_template --editor --quit
          godot --headless --path gameforge/runtime/godot_template --quit-after 3
      - name: Run Godot runtime smoke test
        run: godot --headless --path gameforge/runtime/godot_template --script res://tests/runtime_smoke.gd

  setup-script-validation:
    name: Validate optional local developer scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Linux installer shell syntax
        run: bash -n setup/linux/install-gameforge.sh
      - name: Compile Python setup utilities
        run: python -m py_compile setup/verify_install.py setup/fetch_models.py
      - name: Check required optional scripts
        run: |
          test -s setup/windows/Install-GAMEFORGE.ps1
          test -s setup/linux/install-gameforge.sh
          test -s setup/verify_install.py
          test -s setup/fetch_models.py

  windows-installer-parse:
    name: Parse optional Windows developer script
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse installer without running installation
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "setup/windows/Install-GAMEFORGE.ps1",
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host "PowerShell installer syntax is valid."
