name: FrameForge V2 Manual Operations (Cost-Capped)

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Select one bounded manual operation
        required: true
        type: choice
        options:
          - validate
          - merge-export
          - qa-review-package
      project_path:
        description: V2 project JSON path in this repository
        required: true
        default: examples/frameforge-project-v2.example.json
        type: string
      manifest_path:
        description: Media manifest JSON path in this repository
        required: true
        default: examples/media-asset-manifest.example.json
        type: string
      chunks_dir:
        description: Small render chunk ZIPs under render-input/
        required: true
        default: render-input/chunks
        type: string
      video_path:
        description: Short final video under render-input/
        required: true
        default: render-input/final.mp4
        type: string
      profile:
        description: 720p export orientation
        required: true
        default: 720p-horizontal
        type: choice
        options:
          - 720p-horizontal
          - 720p-vertical
      fps:
        description: Export frame rate
        required: true
        default: "24"
        type: choice
        options:
          - "24"
          - "30"
      max_frames:
        description: Hard frame cap for chunk export (maximum 480)
        required: true
        default: "240"
        type: string

permissions:
  contents: read

concurrency:
  group: frameforge-v2-manual-operations
  cancel-in-progress: true

jobs:
  bounded-operation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out FrameForge
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned development tools
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Install FFmpeg CPU tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Validate project and rights manifest
        if: inputs.operation == 'validate'
        run: |
          python tools/manual_ops.py validate \
            --project "${{ inputs.project_path }}" \
            --manifest "${{ inputs.manifest_path }}"

      - name: Merge and export bounded 720p frame chunks
        if: inputs.operation == 'merge-export'
        run: |
          python tools/manual_ops.py merge-export \
            --chunks-dir "${{ inputs.chunks_dir }}" \
            --profile "${{ inputs.profile }}" \
            --fps "${{ inputs.fps }}" \
            --max-frames "${{ inputs.max_frames }}"

      - name: Run technical QA, visual review and delivery packaging
        if: inputs.operation == 'qa-review-package'
        run: |
          python tools/manual_ops.py qa-review-package \
            --video "${{ inputs.video_path }}" \
            --project "${{ inputs.project_path }}"

      - name: Enforce small artifact budget
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path("artifacts/manual-ops")
          files = [path for path in root.rglob("*") if path.is_file()] if root.exists() else []
          total = sum(path.stat().st_size for path in files)
          print(f"Manual operation outputs: {len(files)} files, {total / 1048576:.2f} MB")
          if total > 100 * 1024 * 1024:
              raise SystemExit("Artifact output exceeds the 100 MB workflow cap.")
          PY

      - name: Upload short-lived operation output
        uses: actions/upload-artifact@v4
        with:
          name: frameforge-v2-manual-output-${{ github.run_number }}
          path: artifacts/manual-ops/
          if-no-files-found: ignore
          retention-days: 3
