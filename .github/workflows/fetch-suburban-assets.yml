name: Fetch and prepare suburban short assets

on:
  push:
    paths:
      - ".github/workflows/fetch-suburban-assets.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-and-convert:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out FrameForge
        uses: actions/checkout@v4

      - name: Download ten rigged CC0 character models
        shell: bash
        run: |
          set -euo pipefail
          ROOT="assets/suburban-short"
          mkdir -p "$ROOT/characters" "$ROOT/source-packs"
          while IFS='|' read -r name url; do
            echo "Fetching $name"
            curl --fail --location --retry 4 --retry-delay 2 "$url" -o "$ROOT/characters/$name.glb"
            test -s "$ROOT/characters/$name.glb"
          done <<'EOF'
          Cashier|https://gobkit.com/freebies/human001/Cashier.glb
          FoodCourier|https://gobkit.com/freebies/human001/FoodCourier.glb
          GrandmaShopper|https://gobkit.com/freebies/human001/GrandmaShopper.glb
          OfficeLady|https://gobkit.com/freebies/human001/OfficeLady.glb
          Schoolkid|https://gobkit.com/freebies/human001/Schoolkid.glb
          Shoplifter|https://gobkit.com/freebies/human001/Shoplifter.glb
          StockClerk|https://gobkit.com/freebies/human001/StockClerk.glb
          StoreManager|https://gobkit.com/freebies/human001/StoreManager.glb
          Accountant|https://gobkit.com/freebies/human002/Accountant.glb
          CompanyCeo|https://gobkit.com/freebies/human002/CompanyCeo.glb
          EOF

      - name: Fetch 129-model CC0 city kit (houses, roads, vehicles, vegetation)
        shell: bash
        run: |
          set -euo pipefail
          ROOT="assets/suburban-short"
          mkdir -p "$ROOT/source-packs"
          git clone --depth 1 https://github.com/kayquer/kit-cidade-lowpoly.git "$ROOT/source-packs/city-kit"
          count=$(find "$ROOT/source-packs/city-kit/models" -type f -iname '*.glb' | wc -l)
          echo "City kit GLB count: $count"
          test "$count" -eq 129
          mkdir -p "$ROOT/licences"
          cp "$ROOT/source-packs/city-kit/README.md" "$ROOT/licences/CC0-City-Kit-README.md"
          if [ -f "$ROOT/source-packs/city-kit/CITATION.cff" ]; then cp "$ROOT/source-packs/city-kit/CITATION.cff" "$ROOT/licences/City-Kit-CITATION.cff"; fi
          find "$ROOT/source-packs/city-kit/models" -type f -iname '*.glb' -printf '%P %s bytes\\n' | sort > "$ROOT/environment-model-list.txt"

      - name: Validate CC0 city assets and character rigs
        shell: bash
        run: |
          set -euo pipefail
          ROOT="assets/suburban-short"
          python - <<'PY'
          import json, os, struct
          root="assets/suburban-short"
          inventory=[]
          for base, _, files in os.walk(os.path.join(root,"characters")):
              for fn in sorted(files):
                  if not fn.endswith(".glb"): continue
                  p=os.path.join(base,fn)
                  with open(p,"rb") as f:
                      head=f.read(12)
                      if len(head)<12 or head[:4]!=b"glTF": raise SystemExit("Invalid GLB header: "+p)
                      chunklen,chunktype=struct.unpack("<II",f.read(8))
                      if chunktype!=0x4E4F534A: raise SystemExit("Missing JSON chunk: "+p)
                      doc=json.loads(f.read(chunklen).decode("utf-8"))
                  skins=doc.get("skins",[])
                  meshes=doc.get("meshes",[])
                  anims=[a.get("name","") for a in doc.get("animations",[])]
                  targets=sum(len(pr.get("targets",[])) for m in meshes for pr in m.get("primitives",[]))
                  inventory.append({"name":fn,"bytes":os.path.getsize(p),"skins":len(skins),"animations":anims,"morph_targets":targets})
          if len(inventory)!=10: raise SystemExit(f"Expected 10 character GLBs, got {len(inventory)}")
          if any(x["skins"]<1 for x in inventory): raise SystemExit("At least one character is not skinned")
          city=os.path.join(root,"source-packs","city-kit","models")
          env=[os.path.join(b,f) for b,_,fs in os.walk(city) for f in fs if f.lower().endswith(".glb")]
          if len(env)!=129: raise SystemExit(f"Expected 129 CC0 city GLBs, got {len(env)}")
          with open(os.path.join(root,"character-inventory.json"),"w") as f: json.dump(inventory,f,indent=2)
          with open(os.path.join(root,"environment-inventory.json"),"w") as f: json.dump([os.path.relpath(p,root) for p in sorted(env)],f,indent=2)
          print("CHARACTER_INVENTORY",json.dumps(inventory))
          print("CITY_GLB_COUNT",len(env))
          PY

      - name: Add source, licence and rig inventory
        shell: bash
        run: |
          set -euo pipefail
          ROOT="assets/suburban-short"
          cat > "$ROOT/SOURCES-AND-LICENCES.txt" <<'EOF'
          HUMAN CHARACTERS
          Source: Gobkit Human001 and Human002 free character packs.
          Licence stated by source manifest: Creative Commons Zero 1.0 (CC0).
          Models are rigged and include baked animation clips. Facial viseme/blendshape support is not assumed; inspect each file before claiming lip-sync support.

          VEHICLES
          Source: Quaternius Cars Pack. CC0; source pack page: https://quaternius.com/packs/cars.html

          BUILDINGS
          Source: Quaternius Simple Buildings Pack. CC0; source pack page: https://quaternius.com/packs/simplebuildings.html

          ROADS
          Source: Quaternius Modular Streets Pack. CC0; source pack page: https://quaternius.com/packs/modularstreets.html

          NATURE
          Source: Quaternius Simple Nature Pack. CC0; source pack page: https://quaternius.com/packs/simplenature.html

          Each included source pack's own licence files are retained when provided. Review the original pack licence before redistributing modified source archives.
          EOF
          python - <<'PY'
          import json, os, struct
          root="assets/suburban-short"
          inventory=[]
          for base, _, files in os.walk(os.path.join(root,"characters")):
              for fn in sorted(files):
                  if not fn.endswith(".glb"): continue
                  p=os.path.join(base,fn)
                  with open(p,"rb") as f:
                      head=f.read(12)
                      if len(head)<12 or head[:4]!=b"glTF":
                          raise SystemExit("Invalid GLB header: "+p)
                      length=struct.unpack("<I",head[8:12])[0]
                      chunkhead=f.read(8)
                      chunklen,chunktype=struct.unpack("<II",chunkhead)
                      if chunktype!=0x4E4F534A: raise SystemExit("Missing JSON chunk: "+p)
                      doc=json.loads(f.read(chunklen).decode("utf-8"))
                  skins=doc.get("skins",[])
                  meshes=doc.get("meshes",[])
                  anims=[a.get("name","") for a in doc.get("animations",[])]
                  targets=sum(len(pr.get("targets",[])) for m in meshes for pr in m.get("primitives",[]))
                  inventory.append({"name":fn,"bytes":os.path.getsize(p),"skins":len(skins),"animations":anims,"morph_targets":targets})
          with open(os.path.join(root,"character-inventory.json"),"w") as f: json.dump(inventory,f,indent=2)
          print("CHARACTER_INVENTORY",json.dumps(inventory))
          if len(inventory)!=10: raise SystemExit(f"Expected 10 character GLBs, got {len(inventory)}")
          if any(x["skins"]<1 for x in inventory): raise SystemExit("At least one character is not skinned")
          PY

      - name: Bundle the prepared assets
        run: |
          set -euo pipefail
          cd assets
          zip -qr ../frameforge-suburban-short-assets.zip suburban-short
          cd ..
          sha256sum frameforge-suburban-short-assets.zip > frameforge-suburban-short-assets.sha256
          ls -lh frameforge-suburban-short-assets.zip

      - name: Upload asset bundle
        uses: actions/upload-artifact@v4
        with:
          name: FrameForge-Suburban-Short-Assets
          path: |
            frameforge-suburban-short-assets.zip
            frameforge-suburban-short-assets.sha256
          if-no-files-found: error
          retention-days: 14
