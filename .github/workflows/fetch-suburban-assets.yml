name: Fetch and prepare suburban short assets

on:
  push:
    paths:
      - ".github/workflows/fetch-suburban-assets.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-and-convert:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out FrameForge
        uses: actions/checkout@v4

      - name: Install asset tools
        run: |
          sudo apt-get update
          sudo apt-get install -y blender
          python -m pip install --upgrade pip gdown

      - name: Download ten rigged CC0 character models
        shell: bash
        run: |
          set -euo pipefail
          ROOT="assets/suburban-short"
          mkdir -p "$ROOT/characters" "$ROOT/source-packs"
          while IFS='|' read -r name url; do
            echo "Fetching $name"
            curl --fail --location --retry 4 --retry-delay 2 "$url" -o "$ROOT/characters/$name.glb"
            test -s "$ROOT/characters/$name.glb"
          done <<'EOF'
          Cashier|https://gobkit.com/freebies/human001/Cashier.glb
          FoodCourier|https://gobkit.com/freebies/human001/FoodCourier.glb
          GrandmaShopper|https://gobkit.com/freebies/human001/GrandmaShopper.glb
          OfficeLady|https://gobkit.com/freebies/human001/OfficeLady.glb
          Schoolkid|https://gobkit.com/freebies/human001/Schoolkid.glb
          Shoplifter|https://gobkit.com/freebies/human001/Shoplifter.glb
          StockClerk|https://gobkit.com/freebies/human001/StockClerk.glb
          StoreManager|https://gobkit.com/freebies/human001/StoreManager.glb
          Accountant|https://gobkit.com/freebies/human002/Accountant.glb
          CompanyCeo|https://gobkit.com/freebies/human002/CompanyCeo.glb
          EOF

      - name: Download CC0 vehicle, house, road and nature packs
        shell: bash
        run: |
          set -euo pipefail
          ROOT="assets/suburban-short/source-packs"
          gdown --folder --remaining-ok "https://drive.google.com/drive/folders/1fKlbDry77iY8KlEoxzUxIAZQL_XhzWlA" -O "$ROOT/cars"
          gdown --folder --remaining-ok "https://drive.google.com/drive/folders/1r-FcNFxC6ziN0oI3GqZJdEkdzglFQHQH" -O "$ROOT/simple-buildings"
          gdown --folder --remaining-ok "https://drive.google.com/drive/folders/1-YvMpLDYBIy-0Ms7ZlFmUpChTbHku8IJ" -O "$ROOT/modular-streets"
          gdown --folder --remaining-ok "https://drive.google.com/drive/folders/18hb-5HGCLL9BS8jmxkE4h31wmHGeqfts" -O "$ROOT/simple-nature"
          find "$ROOT" -type f -printf '%p %s bytes\n' | sort | head -200

      - name: Convert FBX and OBJ scene assets to GLB
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/suburban-short/converted
          cat > /tmp/convert_assets.py <<'PY'
          import bpy, os, sys, re
          root = os.path.abspath(sys.argv[sys.argv.index("--") + 1])
          src = os.path.join(root, "source-packs")
          out = os.path.join(root, "converted")
          os.makedirs(out, exist_ok=True)
          seen = set()
          converted = []
          failures = []
          def safe(s):
              s = re.sub(r"[^A-Za-z0-9._-]+", "-", s).strip("-")
              return s[:90] or "asset"
          for base, dirs, files in os.walk(src):
              dirs.sort()
              files.sort()
              candidates = [f for f in files if os.path.splitext(f)[1].lower() in (".fbx", ".obj")]
              # Prefer FBX where both formats of the same model are supplied.
              candidates.sort(key=lambda f: (0 if f.lower().endswith(".fbx") else 1, f.lower()))
              for filename in candidates:
                  stem = os.path.splitext(filename)[0]
                  key = stem.lower()
                  if key in seen:
                      continue
                  seen.add(key)
                  srcfile = os.path.join(base, filename)
                  rel = os.path.relpath(base, src)
                  destdir = os.path.join(out, safe(rel.replace(os.sep, "-")))
                  os.makedirs(destdir, exist_ok=True)
                  dest = os.path.join(destdir, safe(stem) + ".glb")
                  try:
                      bpy.ops.wm.read_factory_settings(use_empty=True)
                      ext = os.path.splitext(filename)[1].lower()
                      if ext == ".fbx":
                          bpy.ops.import_scene.fbx(filepath=srcfile, use_image_search=True)
                      else:
                          bpy.ops.wm.obj_import(filepath=srcfile)
                      meshes = [o for o in bpy.context.scene.objects if o.type == "MESH"]
                      if not meshes:
                          raise RuntimeError("import produced no mesh objects")
                      bpy.ops.export_scene.gltf(filepath=dest, export_format="GLB", export_apply=True, export_image_format="AUTO", export_cameras=False, export_lights=False)
                      if not os.path.exists(dest) or os.path.getsize(dest) < 1024:
                          raise RuntimeError("GLB export missing or unexpectedly small")
                      converted.append({"source": os.path.relpath(srcfile, root), "glb": os.path.relpath(dest, root), "bytes": os.path.getsize(dest), "mesh_objects": len(meshes)})
                      print("CONVERTED", srcfile, "->", dest)
                  except Exception as exc:
                      failures.append({"source": os.path.relpath(srcfile, root), "error": str(exc)})
                      print("FAILED", srcfile, repr(exc))
          import json
          with open(os.path.join(root, "conversion-report.json"), "w") as f:
              json.dump({"converted": converted, "failures": failures}, f, indent=2)
          print("ASSET_CONVERSION_SUMMARY", len(converted), "converted,", len(failures), "failed")
          if not converted:
              raise SystemExit("No building/vehicle/environment files could be converted")
          PY
          blender -b --python-exit-code 1 --python /tmp/convert_assets.py -- "$PWD/assets/suburban-short"

      - name: Add source, licence and rig inventory
        shell: bash
        run: |
          set -euo pipefail
          ROOT="assets/suburban-short"
          cat > "$ROOT/SOURCES-AND-LICENCES.txt" <<'EOF'
          HUMAN CHARACTERS
          Source: Gobkit Human001 and Human002 free character packs.
          Licence stated by source manifest: Creative Commons Zero 1.0 (CC0).
          Models are rigged and include baked animation clips. Facial viseme/blendshape support is not assumed; inspect each file before claiming lip-sync support.

          VEHICLES
          Source: Quaternius Cars Pack. CC0; source pack page: https://quaternius.com/packs/cars.html

          BUILDINGS
          Source: Quaternius Simple Buildings Pack. CC0; source pack page: https://quaternius.com/packs/simplebuildings.html

          ROADS
          Source: Quaternius Modular Streets Pack. CC0; source pack page: https://quaternius.com/packs/modularstreets.html

          NATURE
          Source: Quaternius Simple Nature Pack. CC0; source pack page: https://quaternius.com/packs/simplenature.html

          Each included source pack's own licence files are retained when provided. Review the original pack licence before redistributing modified source archives.
          EOF
          python - <<'PY'
          import json, os, struct
          root="assets/suburban-short"
          inventory=[]
          for base, _, files in os.walk(os.path.join(root,"characters")):
              for fn in sorted(files):
                  if not fn.endswith(".glb"): continue
                  p=os.path.join(base,fn)
                  with open(p,"rb") as f:
                      head=f.read(12)
                      if len(head)<12 or head[:4]!=b"glTF":
                          raise SystemExit("Invalid GLB header: "+p)
                      length=struct.unpack("<I",head[8:12])[0]
                      chunkhead=f.read(8)
                      chunklen,chunktype=struct.unpack("<II",chunkhead)
                      if chunktype!=0x4E4F534A: raise SystemExit("Missing JSON chunk: "+p)
                      doc=json.loads(f.read(chunklen).decode("utf-8"))
                  skins=doc.get("skins",[])
                  meshes=doc.get("meshes",[])
                  anims=[a.get("name","") for a in doc.get("animations",[])]
                  targets=sum(len(pr.get("targets",[])) for m in meshes for pr in m.get("primitives",[]))
                  inventory.append({"name":fn,"bytes":os.path.getsize(p),"skins":len(skins),"animations":anims,"morph_targets":targets})
          with open(os.path.join(root,"character-inventory.json"),"w") as f: json.dump(inventory,f,indent=2)
          print("CHARACTER_INVENTORY",json.dumps(inventory))
          if len(inventory)!=10: raise SystemExit(f"Expected 10 character GLBs, got {len(inventory)}")
          if any(x["skins"]<1 for x in inventory): raise SystemExit("At least one character is not skinned")
          PY

      - name: Bundle the prepared assets
        run: |
          set -euo pipefail
          cd assets
          zip -qr ../frameforge-suburban-short-assets.zip suburban-short
          cd ..
          sha256sum frameforge-suburban-short-assets.zip > frameforge-suburban-short-assets.sha256
          ls -lh frameforge-suburban-short-assets.zip

      - name: Upload asset bundle
        uses: actions/upload-artifact@v4
        with:
          name: FrameForge-Suburban-Short-Assets
          path: |
            frameforge-suburban-short-assets.zip
            frameforge-suburban-short-assets.sha256
          if-no-files-found: error
          retention-days: 14
