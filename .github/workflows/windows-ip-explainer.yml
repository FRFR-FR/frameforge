name: FrameForge — Windows IP Privacy Explainer (90s)

on:
  push:
    branches: [main]
    paths:
      - "blender_pipeline/windows_ip_explainer.py.gz"
      - "blender_pipeline/windows_ip_narration.txt"
      - ".github/workflows/windows-ip-explainer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Build and audit editable 3D scene
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender and unpack scene script
        run: |
          sudo apt-get update
          sudo apt-get install --yes blender gzip
          gzip -dc blender_pipeline/windows_ip_explainer.py.gz > blender_pipeline/windows_ip_explainer.py
          blender --version
      - name: Audit all 2,700 frames
        run: |
          mkdir -p output/windows_ip_explainer
          blender --background --python-exit-code 1 --python blender_pipeline/windows_ip_explainer.py -- --mode audit --output-dir output/windows_ip_explainer
      - uses: actions/upload-artifact@v4
        with:
          name: FrameForge-Windows-IP-Audit
          path: |
            output/windows_ip_explainer/*.blend
            output/windows_ip_explainer/audit.json
          if-no-files-found: error
          retention-days: 14

  render:
    name: Render section ${{ matrix.segment }}
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        segment: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender and unpack scene script
        run: |
          sudo apt-get update
          sudo apt-get install --yes blender gzip
          gzip -dc blender_pipeline/windows_ip_explainer.py.gz > blender_pipeline/windows_ip_explainer.py
          blender --version
      - name: Render 15-second section at 720 x 1280, 30 FPS
        run: |
          mkdir -p output/windows_ip_explainer
          blender --background --python-exit-code 1 --python blender_pipeline/windows_ip_explainer.py -- --mode render --segment-index ${{ matrix.segment }} --output-dir output/windows_ip_explainer
      - uses: actions/upload-artifact@v4
        with:
          name: FrameForge-Windows-IP-part-${{ matrix.segment }}
          path: output/windows_ip_explainer/segment_${{ matrix.segment }}.mp4
          if-no-files-found: error
          retention-days: 14

  assemble:
    name: Assemble and verify final narrated MP4
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: FrameForge-Windows-IP-part-*
          path: output/segments
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: FrameForge-Windows-IP-Audit
          path: output/project
      - name: Install FFmpeg and narration voice
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg espeak-ng
          ffmpeg -version | head -n 1
      - name: Join sections, add narration and verify
        run: |
          set -euo pipefail
          mkdir -p output/final
          for i in 00 01 02 03 04 05; do test -s "output/segments/segment_${i}.mp4"; done
          for i in 00 01 02 03 04 05; do printf "file '%s'\n" "$PWD/output/segments/segment_${i}.mp4"; done > output/concat.txt
          ffmpeg -y -f concat -safe 0 -i output/concat.txt -c copy output/silent_join.mp4
          espeak-ng -v en-us -s 158 -p 43 -a 170 -f blender_pipeline/windows_ip_narration.txt -w output/narration.wav
          ffmpeg -y -i output/silent_join.mp4 -i output/narration.wav -map 0:v:0 -map 1:a:0 -c:v copy -c:a aac -b:a 160k -af "apad=pad_dur=90" -t 90 -movflags +faststart output/final/FrameForge_Windows_IP_Privacy_90s.mp4
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height,r_frame_rate -of json output/final/FrameForge_Windows_IP_Privacy_90s.mp4 > output/final/verification.json
          python3 - <<'PY'
          import json
          d=json.load(open('output/final/verification.json'))
          v=next(s for s in d['streams'] if s['codec_name']=='h264')
          dur=float(d['format']['duration'])
          assert (v['width'],v['height'])==(720,1280),v
          assert v['r_frame_rate']=='30/1',v
          assert 89.8 <= dur <= 90.2,dur
          assert int(d['format']['size']) > 1000000,d
          print('FINAL_VIDEO_VERIFIED',dur,'seconds',v['width'],'x',v['height'],v['r_frame_rate'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: FrameForge-Windows-IP-Privacy-FINAL
          path: |
            output/final/FrameForge_Windows_IP_Privacy_90s.mp4
            output/final/verification.json
            output/project/*.blend
            output/project/audit.json
            output/narration.wav
          if-no-files-found: error
          retention-days: 14