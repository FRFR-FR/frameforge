name: FrameForge — Windows IP Privacy AAA Explainer (90s)
run-name: Build Windows IP Privacy AAA video

on:
  push:
    branches: [main]
    paths:
      - "blender_pipeline/windows_ip_explainer.py"
      - "blender_pipeline/windows_ip_narration.txt"
      - ".github/workflows/windows-ip-explainer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Build and audit continuously animated 3D scene
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender and render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes blender ffmpeg libegl1 libegl-mesa0 libgl1-mesa-dri xvfb fonts-dejavu-core
          python3 -m py_compile blender_pipeline/windows_ip_explainer.py
          blender --version
      - name: Audit all 2,700 frames and verify continuous motion
        run: |
          mkdir -p output/windows_ip_explainer
          blender --background --python-exit-code 1 --python blender_pipeline/windows_ip_explainer.py -- --mode audit --output-dir output/windows_ip_explainer
          python3 - <<'PY'
          import json
          d=json.load(open('output/windows_ip_explainer/audit.json'))
          assert d['status']=='PASS',d
          assert d['frame_count']==2700,d
          assert d['resolution']==[1080,1920],d
          assert d['frame_to_frame_motion_audit_percent'] >= 90,d
          print('CONTINUOUS_MOTION_AUDIT_PASS',d['frame_to_frame_motion_audit_percent'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: FrameForge-Windows-IP-AAA-Audit
          path: |
            output/windows_ip_explainer/*.blend
            output/windows_ip_explainer/audit.json
          if-no-files-found: error
          retention-days: 14

  render:
    name: Render AAA section ${{ matrix.segment }}
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        segment: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender and render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes blender ffmpeg libegl1 libegl-mesa0 libgl1-mesa-dri xvfb fonts-dejavu-core
          python3 -m py_compile blender_pipeline/windows_ip_explainer.py
          blender --version
      - name: Render 15-second AAA section at 1080 x 1920, 30 FPS
        run: |
          mkdir -p output/windows_ip_explainer
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 blender --background --python-exit-code 1 --python blender_pipeline/windows_ip_explainer.py -- --mode render --segment-index ${{ matrix.segment }} --output-dir output/windows_ip_explainer
      - uses: actions/upload-artifact@v4
        with:
          name: FrameForge-Windows-IP-AAA-part-${{ matrix.segment }}
          path: output/windows_ip_explainer/segment_0${{ matrix.segment }}.mp4
          if-no-files-found: error
          retention-days: 14

  assemble:
    name: Assemble and verify final AAA narrated MP4
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: FrameForge-Windows-IP-AAA-part-*
          path: output/segments
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: FrameForge-Windows-IP-AAA-Audit
          path: output/project
      - name: Install FFmpeg and narration voice
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg espeak-ng
          ffmpeg -version | head -n 1
      - name: Join sections, add narration and verify
        run: |
          set -euo pipefail
          mkdir -p output/final
          for i in 00 01 02 03 04 05; do test -s "output/segments/segment_${i}.mp4"; done
          for i in 00 01 02 03 04 05; do printf "file '%s'\n" "$PWD/output/segments/segment_${i}.mp4"; done > output/concat.txt
          ffmpeg -y -f concat -safe 0 -i output/concat.txt -c copy output/silent_join.mp4
          espeak-ng -v en-us -s 158 -p 43 -a 170 -f blender_pipeline/windows_ip_narration.txt -w output/narration.wav
          ffmpeg -y -i output/silent_join.mp4 -i output/narration.wav -map 0:v:0 -map 1:a:0 -c:v copy -c:a aac -b:a 192k -af "apad=pad_dur=90" -t 90 -movflags +faststart output/final/FrameForge_Windows_IP_Privacy_90s_AAA.mp4
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height,r_frame_rate -of json output/final/FrameForge_Windows_IP_Privacy_90s_AAA.mp4 > output/final/verification.json
          python3 - <<'PY'
          import json
          d=json.load(open('output/final/verification.json'))
          v=next(s for s in d['streams'] if s['codec_name']=='h264')
          a=next(s for s in d['streams'] if s['codec_name']=='aac')
          dur=float(d['format']['duration'])
          assert (v['width'],v['height'])==(1080,1920),v
          assert v['r_frame_rate']=='30/1',v
          assert 89.8 <= dur <= 90.2,dur
          assert int(d['format']['size']) > 3000000,d
          print('AAA_FINAL_VIDEO_VERIFIED',dur,'seconds',v['width'],'x',v['height'],v['r_frame_rate'],'audio',a['codec_name'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: FrameForge-Windows-IP-Privacy-AAA-FINAL
          path: |
            output/final/FrameForge_Windows_IP_Privacy_90s_AAA.mp4
            output/final/verification.json
            output/project/*.blend
            output/project/audit.json
            output/narration.wav
          if-no-files-found: error
          retention-days: 14
